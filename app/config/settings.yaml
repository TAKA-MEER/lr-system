stt:
  model_size: large-v3        # large-v3 / medium / small
  device: cuda
  compute_type: float16
  language: ja
  chunk_seconds: 5            # 文字起こしチャンク長（秒）
  vad_enabled: true        # true: VAD有効（無音区間をスキップ） / false: VAD無効（小さな音も拾う）
                            # 3時間耐久試験(testing/CHANGELOG.md参照)で、vad_enabled=falseだと
                            # 計測待ち等の無音区間でfaster-whisperが同一フレーズを繰り返し
                            # ハルシネーションし、文字起こしの9割近くがゴミセグメントになる
                            # 不具合が判明したため、trueに変更した。スピーカー再生した音声を
                            # マイクで拾う検証方式では小さな音をVADが無音と誤判定するおそれが
                            # あるため、その場合はvad_thresholdを下げる（例: 0.02〜0.03）か、
                            # 短時間試験に限りfalseに戻すことを検討する。
  vad_threshold: 0.05
  vad_min_silence_ms: 300
  vad_speech_pad_ms: 300
  initial_prompt: ""          # Whisperへの文脈ヒント({trial_name}で試験名を差し込める)。第2期試験で専門用語を並べた
                              # ヒントを与えるとCERが0.161→0.268に悪化したため、既定では使わない(空欄)

speaker:
  method: adaptive            # adaptive: 50msフレームの発話判定+自動閾値+セグメント単位の判定(既定)
                              # legacy: 5秒チャンクのRMSを bt_rms_threshold と比較する旧方式
  history_seconds: 60.0       # adaptive: 自動閾値を決めるために見る直近のBT音声の長さ
  margin_db: 16.0             # adaptive: 装着者の発話の大きさから何dB下までを「発話」とみなすか
  segment_active_ratio: 0.3   # adaptive: セグメントの時間のうちBT装着者の発話がこの割合を超えれば our_side
  bt_rms_threshold: 800.0     # legacy方式の閾値(画面のスライダーで変更できるのはこの値のみ)
  history_window_seconds: 10.0

llm:
  model: qwen3.5:9b
  max_tokens: 4096
  stage2_max_tokens: 8192     # 最終議事録の出力上限。協議事項が多い試験で出力が途中で切れるのを防ぐ
  structured_output: true     # 出力をJSONスキーマで制約する(JSONの書式崩れで議事録が空になるのを防ぐ)
  num_gpu: 99                 # 全層をGPUに載せる。未指定だとOllamaが空きVRAMの余裕を多めに取り、
                              # 一部の層をCPUに逃がして生成が約3倍遅くなる(第2期試験で確認)。
                              # VRAMが足りずに失敗した場合は自動で指定なしに切り替えて再試行する
  chunk_chars: 6000           # Stage1チャンクの文字数(比較実験 exp/prog-merge で2000から拡大。1つの協議がチャンクをまたぎにくくする)
  prog_merge: true            # Stage2の前にプログラムで同じ話題を名寄せする(比較実験 exp/prog-merge)
  temperature: 0.2            # 低めにしてJSON出力のフォーマット逸脱・解析失敗を減らす
  num_ctx: 32768               # Ollamaへの明示的なコンテキスト長指定。未指定だとOllamaの既定値
                                # (数千トークン程度)が使われ、3時間耐久試験でStage2プロンプトが
                                # 5000トークンを超えた際に入力だけで既定値を超過し、出力がほぼ
                                # 生成されずJSON解析に失敗する不具合が判明した(testing/CHANGELOG.md参照)。

output:
  dir: /output
