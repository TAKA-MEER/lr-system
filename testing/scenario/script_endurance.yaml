# 台本endurance: 受変電設備用配電盤(A盤・B盤 2面) 出荷前立会試験(3時間耐久試験用)
# 想定尺: 約3時間(生成後にtimeline.jsonのtotal_duration_secを見てwait_secondsを調整する)
# 用途: testing/tts/generate_audio.py が読み込み、VOICEVOXで音声合成する
#
# script_v1.yaml との違い:
#   - 単なるループではなく新規に書き起こした、より長い立会試験の台本(2面の盤を対象とし、
#     絶縁抵抗・耐電圧・シーケンス・インターロック・保護継電器・温度上昇試験まで実施する)
#   - 各ターンに任意で wait_seconds を持たせられる。実機の計測・機器セットアップ・
#     温度安定待ち・休憩など、発話の無い実時間経過を表現するための追加無音秒数。
#     generate_audio.py が turn_gap_seconds のランダム間隔とは別に、このターンの直後に
#     wait_seconds 分の無音を internal_mix / bt_mix 両方に挿入する。
#   - 絶縁抵抗(A盤)の状態矛盾(継続協議→温度上昇試験中に技術部確認が取れ合意済みへ)を
#     引き続き含み、加えて表示灯色違い・銘板誤記の2件のアクションアイテムも含める。
#     Stage1チャンク数が大幅に増える環境でこれらの統合ロジックが崩れないかを検証する。
#
# 重要: BTイヤホンは自社側1名(meta.bt_wearer = 田中誠)のみが装着している想定。
# bt_mix.wav では speaker == meta.bt_wearer の発話区間のみ音声を残し、それ以外(client発話は
# もちろん、鈴木舞=our_sideだがBT非装着の発話も含む)は無音にする(script_v1.yaml と同じ制約)。
# 評価時の正解は expected_minutes_endurance.yaml を使う。

meta:
  trial_name: "受変電設備用配電盤 A盤(受電盤 型式 SWB-3100R)・B盤(配電盤 型式 SWB-3100D) 出荷前立会試験"
  location: "本社工場 高圧試験室"
  client_attendees: ["山田 隆", "佐藤 健二"]
  our_attendees: ["田中 誠", "鈴木 舞"]
  bt_wearer: "田中 誠"

speakers:
  山田 隆: client
  佐藤 健二: client
  田中 誠: our_side
  鈴木 舞: our_side

turns:
  # ── ①開会・出席確認・試験項目説明 ──────────────────────────
  - id: 1
    speaker: "田中 誠"
    text: "えー、それでは時間になりましたので、受変電設備用配電盤、A盤の受電盤SWB-3100RおよびB盤の配電盤SWB-3100D、2面の出荷前立会試験を始めさせていただきます。本日はお忙しい中、また長時間になりますが、お越しいただきありがとうございます。"
  - id: 2
    speaker: "山田 隆"
    text: "よろしくお願いします。本日は私、山田と、"
  - id: 3
    speaker: "佐藤 健二"
    text: "佐藤が立ち会わせていただきます。よろしくお願いします。"
  - id: 4
    speaker: "田中 誠"
    text: "はい、よろしくお願いします。自社側は、立会責任者の田中と、記録を担当します鈴木の2名で対応いたします。"
  - id: 5
    speaker: "鈴木 舞"
    text: "鈴木です。よろしくお願いいたします。本日の試験項目ですが、A盤・B盤それぞれの外観・寸法確認から始めまして、絶縁抵抗試験、耐電圧試験、シーケンス動作試験、インターロック試験、保護継電器動作試験、そして最後に温度上昇試験を実施いたします。温度上昇試験は定格電流を通電し続けて温度が安定するまで確認いたしますので、本日は全体で3時間ほどのお時間をいただく予定です。"
  - id: 6
    speaker: "山田 隆"
    text: "承知しました。長時間になりますが、よろしくお願いします。"
  - id: 7
    speaker: "佐藤 健二"
    text: "温度上昇試験というのは、具体的にどれくらい通電し続けるものなんですか。"
  - id: 8
    speaker: "鈴木 舞"
    text: "規格上は温度がほぼ一定になるまで、となっておりまして、目安として1時間から1時間半ほど定格電流を流し続けます。その間、20分おきくらいに温度計測のご報告を挟みながら進めさせていただきます。"
  - id: 9
    speaker: "佐藤 健二"
    text: "分かりました。長丁場ですが、よろしくお願いします。"
  - id: 10
    speaker: "田中 誠"
    text: "それでは始めます。まずA盤の受電盤から確認をお願いいたします。"

  # ── ②外観・構造・寸法確認(A盤・B盤) ──────────────────────
  - id: 11
    speaker: "田中 誠"
    text: "こちらがA盤、受電盤SWB-3100Rになります。外観と構造、それから図面との寸法照合から始めさせていただきます。盤の正面をご覧ください。"
    wait_seconds: 240
  - id: 12
    speaker: "佐藤 健二"
    text: "はい。扉の建付けは問題なさそうですね。ハンドルの動きも良好です。塗装も特に問題は見当たりません。"
  - id: 13
    speaker: "山田 隆"
    text: "こちらの計器類の配置も、図面通りで間違いないですね。"
  - id: 14
    speaker: "鈴木 舞"
    text: "はい、図面通りに配置しております。それでは寸法の確認に移ります。幅・高さ・奥行きを実測いたしますので少々お待ちください。"
    wait_seconds: 270
  - id: 15
    speaker: "鈴木 舞"
    text: "実測しました。幅900、高さ2100、奥行き800、いずれもミリメートルで、図面通りの寸法となっております。"
  - id: 16
    speaker: "佐藤 健二"
    text: "確認しました、問題ありません。それでは続いてB盤もお願いします。"
  - id: 17
    speaker: "田中 誠"
    text: "はい、こちらがB盤、配電盤SWB-3100Dになります。同様に外観からご確認ください。"
    wait_seconds: 240
  - id: 18
    speaker: "山田 隆"
    text: "扉の建付け、ハンドルの動作、いずれも問題なさそうです。……あ、この扉の下の方なんですが、塗装に少しムラがあるように見えます。"
  - id: 19
    speaker: "田中 誠"
    text: "あ、こちらですね。確認いたします。……ああ、本当ですね、少し塗装ムラがございます。申し訳ございません。"
  - id: 20
    speaker: "山田 隆"
    text: "機能的には問題ないと思いますが、出荷前に一度塗り直しをお願いできますか。"
  - id: 21
    speaker: "田中 誠"
    text: "承知しました。出荷前に該当箇所を再塗装して対応させていただきます。それでよろしいでしょうか。"
  - id: 22
    speaker: "山田 隆"
    text: "はい、それで結構です。ではその点は合意ということで。"
  - id: 23
    speaker: "鈴木 舞"
    text: "ありがとうございます。B盤の寸法も実測いたします。少々お待ちください。"
    wait_seconds: 270
  - id: 24
    speaker: "鈴木 舞"
    text: "B盤も実測しました。幅600、高さ2100、奥行き600、こちらも図面通りとなっております。"
  - id: 25
    speaker: "佐藤 健二"
    text: "はい、B盤の寸法も問題ありません。それでは次の試験に進んでください。"

  # ── ③A盤 絶縁抵抗試験(状態: 継続協議) ──────────────
  - id: 26
    speaker: "鈴木 舞"
    text: "それでは絶縁抵抗試験に移ります。まずA盤の受電盤から実施します。メガーを使用し、主回路・大地間の絶縁抵抗を測定いたします。少々お待ちください。"
    wait_seconds: 330
  - id: 27
    speaker: "鈴木 舞"
    text: "測定完了しました。A盤の結果は、主回路・大地間で3.2メグオームとなっております。"
  - id: 28
    speaker: "山田 隆"
    text: "3.2メグオームですか。うーん、社内規格の下限値が3メグオームだったと思いますので、かなり基準値に近い数値ですね。これは大丈夫なんでしょうか。"
  - id: 29
    speaker: "田中 誠"
    text: "おっしゃる通り、規格は満たしておりますが下限に近い数値です。湿度など測定環境の影響も考えられますので、この場でお答えするより、一度技術部に持ち帰って確認させていただきたいと思います。"
  - id: 30
    speaker: "佐藤 健二"
    text: "なるほど。では、この件は今日この場では結論を出さない、ということでよろしいですか。"
  - id: 31
    speaker: "田中 誠"
    text: "はい、大変恐れ入りますが、A盤の絶縁抵抗の件は本日のところは継続協議とさせてください。技術部確認後、あらためてご報告いたします。"
  - id: 32
    speaker: "山田 隆"
    text: "承知しました。それではA盤絶縁抵抗の件は継続協議ということで、後ほどのご報告をお待ちします。"
  - id: 33
    speaker: "鈴木 舞"
    text: "ありがとうございます。続いてB盤の絶縁抵抗試験に移ります。同様に主回路・大地間を測定いたします。少々お待ちください。"
    wait_seconds: 330
  - id: 34
    speaker: "鈴木 舞"
    text: "測定完了しました。B盤の結果は、主回路・大地間で12.5メグオーム、制御回路・大地間で18.0メグオールとなっております。いずれも規格を十分に満たしております。"
  - id: 35
    speaker: "佐藤 健二"
    text: "B盤の方は数値に余裕がありますね。問題ありません。B盤絶縁抵抗の件は合意とします。"
  - id: 36
    speaker: "田中 誠"
    text: "ありがとうございます。B盤の絶縁抵抗、合意ということで承知いたしました。"

  # ── ④耐電圧試験(A盤・B盤) ────────────────────
  - id: 37
    speaker: "鈴木 舞"
    text: "続いて耐電圧試験に移ります。まずA盤、主回路に対して定格の1.5倍の電圧を1分間印加します。開始します。"
    wait_seconds: 250
  - id: 38
    speaker: "鈴木 舞"
    text: "……1分間経過しました。フラッシュオーバー、絶縁破壊とも認められませんでした。A盤の耐電圧試験は合格です。"
  - id: 39
    speaker: "山田 隆"
    text: "A盤の耐電圧は問題なしと。了解しました。"
  - id: 40
    speaker: "鈴木 舞"
    text: "続いてB盤も同様に実施します。開始します。"
    wait_seconds: 250
  - id: 41
    speaker: "鈴木 舞"
    text: "……こちらも1分間経過しました。異常は認められませんでした。B盤の耐電圧試験も合格です。"
  - id: 42
    speaker: "佐藤 健二"
    text: "両盤とも耐電圧は問題なしということで確認しました。"
  - id: 43
    speaker: "田中 誠"
    text: "ありがとうございます。それでは少し機材の入れ替えがございますので、数分お待ちいただけますでしょうか。"
    wait_seconds: 330

  # ── ⑤シーケンス動作試験(A盤・B盤) ──────────────
  - id: 44
    speaker: "鈴木 舞"
    text: "お待たせいたしました。続きまして、シーケンス動作試験を実施します。まずA盤、投入・遮断の基本シーケンスを一通り確認いたします。"
  - id: 45
    speaker: "鈴木 舞"
    text: "投入操作、遮断操作とも正常に動作しております。表示器の状態表示も一致しています。A盤の基本シーケンスは問題ありません。"
  - id: 46
    speaker: "山田 隆"
    text: "了解しました。続けてB盤もお願いします。"
  - id: 47
    speaker: "鈴木 舞"
    text: "B盤も同様に投入・遮断のシーケンスを確認いたします。"
    wait_seconds: 210
  - id: 48
    speaker: "鈴木 舞"
    text: "B盤も投入・遮断とも正常です。連動する表示灯の点灯順序も設計通りとなっております。"
  - id: 49
    speaker: "佐藤 健二"
    text: "両盤ともシーケンス動作は問題ありませんね。承知しました。"
  - id: 50
    speaker: "田中 誠"
    text: "ありがとうございます。続いてインターロック試験に移らせていただきます。"

  # ── ⑥インターロック試験 ──────────────
  - id: 51
    speaker: "鈴木 舞"
    text: "インターロック試験を実施します。まず、扉が開いた状態では投入操作ができないことを確認する、扉インターロックからです。"
  - id: 52
    speaker: "鈴木 舞"
    text: "扉を開いた状態で投入操作を試みます。……はい、機械的にハンドルがロックされ、投入操作ができないことを確認しました。"
  - id: 53
    speaker: "山田 隆"
    text: "扉インターロックは確認できました。続けてお願いします。"
  - id: 54
    speaker: "佐藤 健二"
    text: "それと、念のためなんですが、非常停止時のインターロックについても、もう少し詳しく確認させていただきたいのですが、可能ですか。"
  - id: 55
    speaker: "田中 誠"
    text: "承知しました。非常停止インターロックの追加確認ですね、問題ございません。この場で追加の動作確認を実施いたします。"
    wait_seconds: 210
  - id: 56
    speaker: "鈴木 舞"
    text: "非常停止ボタンを押下します。……はい、主回路が瞬時に遮断され、再投入もインターロックにより阻止されることを確認しました。復旧操作を行わない限り再投入できない構造です。"
  - id: 57
    speaker: "山田 隆"
    text: "確認できました。インターロックの動作は問題ないですね。この件は合意ということでお願いします。"
  - id: 58
    speaker: "田中 誠"
    text: "ありがとうございます。非常停止インターロックの追加確認、合意ということで承知しました。"

  # ── ⑦保護継電器動作試験 ──────────────
  - id: 59
    speaker: "鈴木 舞"
    text: "続いて保護継電器の動作試験に移ります。継電器試験器を使用し、過電流継電器、過電圧継電器、不足電圧継電器、地絡継電器の4項目を順番に確認いたします。まず過電流継電器から、試験器のセッティングを行いますので少々お待ちください。"
    wait_seconds: 330
  - id: 60
    speaker: "鈴木 舞"
    text: "過電流継電器の試験を実施します。整定値の150パーセントの電流を模擬入力します。……はい、整定通りの時限で動作し、遮断器がトリップすることを確認しました。"
  - id: 61
    speaker: "佐藤 健二"
    text: "過電流継電器は問題なしですね。次お願いします。"
  - id: 62
    speaker: "鈴木 舞"
    text: "続いて過電圧継電器の試験です。試験器のセッティングを変更します。"
    wait_seconds: 300
  - id: 63
    speaker: "鈴木 舞"
    text: "整定値を超える電圧を模擬入力しました。……こちらも整定通りに動作し、警報が発報することを確認しました。"
  - id: 64
    speaker: "山田 隆"
    text: "過電圧継電器も問題なしと。了解しました。"
  - id: 65
    speaker: "鈴木 舞"
    text: "続いて不足電圧継電器です。同様にセッティングを行います。"
    wait_seconds: 300
  - id: 66
    speaker: "鈴木 舞"
    text: "整定値を下回る電圧を模擬入力しました。……はい、こちらも整定通りに動作しております。"
  - id: 67
    speaker: "佐藤 健二"
    text: "不足電圧継電器も確認できました。最後、地絡継電器ですね。"
  - id: 68
    speaker: "鈴木 舞"
    text: "はい、地絡継電器の試験です。模擬地絡電流を入力するセッティングを行います。"
    wait_seconds: 300
  - id: 69
    speaker: "鈴木 舞"
    text: "模擬地絡電流を入力しました。……整定通りに動作し、地絡表示灯が点灯、警報も発報することを確認しました。"
  - id: 70
    speaker: "山田 隆"
    text: "地絡継電器も問題ありません。これで保護継電器の4項目、すべて確認できましたね。"
  - id: 71
    speaker: "田中 誠"
    text: "はい、過電流・過電圧・不足電圧・地絡、いずれも整定通り正常に動作することを確認いたしました。保護継電器動作試験は以上ですべて合格です。"
  - id: 72
    speaker: "佐藤 健二"
    text: "承知しました。保護継電器の件は合意とします。"

  # ── ⑧温度上昇試験(長時間通電・定期報告) ──────────────
  - id: 73
    speaker: "田中 誠"
    text: "ありがとうございます。それでは最後の主要項目、温度上昇試験に移ります。定格電流を通電し続け、各部の温度がほぼ一定になるまで確認いたします。先ほどお伝えした通り、1時間から1時間半ほどかかる見込みです。"
  - id: 74
    speaker: "鈴木 舞"
    text: "主回路に定格電流を通電開始します。母線・遮断器端子部・変圧器巻線部の3か所に熱電対を取り付けております。通電開始します。"
    wait_seconds: 900
  - id: 75
    speaker: "鈴木 舞"
    text: "通電開始から15分経過しました。現時点の温度上昇値は、母線部で12度、遮断器端子部で15度、変圧器巻線部で18度となっております。まだ上昇傾向です。"
  - id: 76
    speaker: "山田 隆"
    text: "承知しました。引き続き経過を見させていただきます。"
    wait_seconds: 900
  - id: 77
    speaker: "鈴木 舞"
    text: "30分経過時点のご報告です。母線部で20度、遮断器端子部で24度、変圧器巻線部で29度です。上昇幅はやや鈍化してきております。"
  - id: 78
    speaker: "佐藤 健二"
    text: "了解しました。規格の許容温度上昇値に対してはまだ余裕がありますか。"
  - id: 79
    speaker: "田中 誠"
    text: "はい、規格上の許容値は変圧器巻線部で50度となっておりますので、現状は十分に余裕がございます。"
    wait_seconds: 900
  - id: 80
    speaker: "鈴木 舞"
    text: "45分経過時点です。母線部で25度、遮断器端子部で29度、変圧器巻線部で35度です。上昇幅がさらに小さくなってきておりまして、飽和に近づいている傾向です。"
  - id: 81
    speaker: "山田 隆"
    text: "承知しました。もう少し様子を見させていただきます。"
    wait_seconds: 900
