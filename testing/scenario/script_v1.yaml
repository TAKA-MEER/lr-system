# 台本v1: 配電盤 出荷前立会試験
# 想定尺: 約11分
# 用途: testing/tts/generate_audio.py が読み込み、VOICEVOXで音声合成する
#
# speaker: 発話者名 (voice_map.yaml で声を割り当てる、role は speakers: セクションで定義)
#
# 重要: BTイヤホンは自社側1名(meta.bt_wearer = 田中誠)のみが装着している想定。
# bt_mix.wav では speaker == meta.bt_wearer の発話区間のみ音声を残し、それ以外(client発話は
# もちろん、鈴木舞=our_sideだがBT非装着の発話も含む)は無音にする。
# これにより、現行システムのRMSベース話者判定が「鈴木舞の発話をclientと誤判定する」という
# 実運用上の制約(BTイヤホンを1名しか装着していない場合の既知の限界)を忠実に再現する。
# 評価時の正解は expected_minutes_v1.yaml の speaker_turn_summary.system_expected を使う。

meta:
  trial_name: "受変電設備用配電盤(型式 SWB-2200) 出荷前立会試験"
  location: "第2工場 電気試験室"
  client_attendees: ["山田 隆", "佐藤 健二"]
  our_attendees: ["田中 誠", "鈴木 舞"]
  bt_wearer: "田中 誠"

speakers:
  山田 隆: client
  佐藤 健二: client
  田中 誠: our_side
  鈴木 舞: our_side

turns:
  # ── ①開会・出席確認 ──────────────────────────
  - id: 1
    speaker: "田中 誠"
    text: "えー、それでは時間になりましたので、受変電設備用配電盤、型式SWB-2200の出荷前立会試験を始めさせていただきます。本日はお忙しい中お越しいただきありがとうございます。"
  - id: 2
    speaker: "山田 隆"
    text: "よろしくお願いします。本日は私、山田と、"
  - id: 3
    speaker: "佐藤 健二"
    text: "佐藤が立ち会わせていただきます。よろしくお願いします。"
  - id: 4
    speaker: "田中 誠"
    text: "はい、よろしくお願いします。自社側は、立会責任者の田中と、記録を担当します鈴木の2名で対応いたします。"
  - id: 5
    speaker: "鈴木 舞"
    text: "鈴木です。よろしくお願いいたします。本日の試験項目ですが、外観・寸法確認、絶縁抵抗試験、耐電圧試験、シーケンス動作試験、それから銘板・附属図書の確認、以上の順番で進めさせていただきます。"
  - id: 6
    speaker: "山田 隆"
    text: "はい、承知しました。よろしくお願いします。"

  # ── ②外観・構造・寸法確認 ──────────────────────
  - id: 7
    speaker: "田中 誠"
    text: "それでは早速ですが、まず外観と構造、それから図面との寸法照合から始めさせていただきます。盤の正面をご覧ください。"
  - id: 8
    speaker: "佐藤 健二"
    text: "はい。扉の建付けは、うん、問題なさそうですね。ハンドルの動きも良好です。あ、ちょっと待ってください、この扉の下の方、塗装に少しムラがあるように見えるんですが。"
  - id: 9
    speaker: "田中 誠"
    text: "あ、こちらですね。確認いたします。……ああ、本当ですね、少し塗装ムラがございます。申し訳ございません。"
  - id: 10
    speaker: "山田 隆"
    text: "機能的には問題ないと思いますが、出荷前に一度塗り直しをお願いできますか。"
  - id: 11
    speaker: "田中 誠"
    text: "承知しました。出荷前に該当箇所を再塗装して対応させていただきます。それでよろしいでしょうか。"
  - id: 12
    speaker: "山田 隆"
    text: "はい、それで結構です。ではその点は合意ということで。"
  - id: 13
    speaker: "鈴木 舞"
    text: "ありがとうございます。では続いて寸法の確認に移ります。図面をお手元にお配りしております、幅・高さ・奥行きともに図面通りであることをご確認ください。"
  - id: 14
    speaker: "佐藤 健二"
    text: "はい、実測しましたが、寸法は図面通りで問題ありません。"
  - id: 15
    speaker: "田中 誠"
    text: "ありがとうございます。それでは次に、絶縁抵抗試験に移らせていただきます。"

  # ── ③絶縁抵抗試験(状態: 継続協議) ──────────────
  - id: 16
    speaker: "鈴木 舞"
    text: "絶縁抵抗試験を実施します。メガーを使用し、主回路・大地間の絶縁抵抗を測定いたします。少々お待ちください。"
  - id: 17
    speaker: "鈴木 舞"
    text: "測定完了しました。結果は、主回路・大地間で3.2メグオームとなっております。"
  - id: 18
    speaker: "山田 隆"
    text: "3.2メグオームですか。うーん、社内規格の下限値が3メグオームだったと思いますので、かなり基準値に近い数値ですね。これは大丈夫なんでしょうか。"
  - id: 19
    speaker: "田中 誠"
    text: "おっしゃる通り、規格は満たしておりますが下限に近い数値です。湿度など測定環境の影響も考えられますので、この場でお答えするより、一度技術部に持ち帰って確認させていただきたいと思います。"
  - id: 20
    speaker: "佐藤 健二"
    text: "なるほど。では、この件は今日この場では結論を出さない、ということでよろしいですか。"
  - id: 21
    speaker: "田中 誠"
    text: "はい、大変恐れ入りますが、絶縁抵抗の件は本日のところは継続協議とさせてください。技術部確認後、あらためてご報告いたします。"
  - id: 22
    speaker: "山田 隆"
    text: "承知しました。それでは絶縁抵抗の件は継続協議ということで、後ほどのご報告をお待ちします。"
  - id: 23
    speaker: "鈴木 舞"
    text: "ありがとうございます。それでは次、耐電圧試験に進みます。"

  # ── ④耐電圧試験・表示灯の指摘 ────────────────────
  - id: 24
    speaker: "鈴木 舞"
    text: "耐電圧試験を実施します。主回路に対して定格の1.5倍の電圧を1分間印加します。開始します。"
  - id: 25
    speaker: "鈴木 舞"
    text: "……1分間経過しました。フラッシュオーバー、絶縁破壊とも認められませんでした。耐電圧試験は合格です。"
  - id: 26
    speaker: "佐藤 健二"
    text: "耐電圧は問題なしと。了解しました。あ、次に盤の表示灯なんですが、この電源表示のランプ、色が仕様書と違うように見えます。仕様では緑色指定だったと思うのですが、これは白色ですよね。"
  - id: 27
    speaker: "田中 誠"
    text: "確認いたします。……申し訳ございません、ご指摘の通り、仕様書では緑色指定となっております。手配のミスで白色のランプが取り付けられてしまっているようです。"
  - id: 28
    speaker: "山田 隆"
    text: "それは仕様通りに交換していただけますか。"
  - id: 29
    speaker: "田中 誠"
    text: "はい、大変申し訳ございません。緑色の表示灯に交換いたします。手配に数日かかりますので、来週金曜、7月10日までに交換を完了させていただきます。"
  - id: 30
    speaker: "山田 隆"
    text: "承知しました。では表示灯の交換は自社側対応で、7月10日までということでお願いします。"
  - id: 31
    speaker: "田中 誠"
    text: "かしこまりました。7月10日までに表示灯を交換いたします。"

  # ── ⑤シーケンス・インターロック動作試験 ──────────────
  - id: 32
    speaker: "鈴木 舞"
    text: "続きまして、シーケンス動作試験を実施します。投入・遮断の基本シーケンスを一通り確認いたします。"
  - id: 33
    speaker: "鈴木 舞"
    text: "投入操作、遮断操作とも正常に動作しております。表示器の状態表示も一致しています。基本シーケンスは問題ありません。"
  - id: 34
    speaker: "佐藤 健二"
    text: "基本シーケンスは了解しました。それと、念のためなんですが、非常停止時のインターロックについても、もう少し詳しく確認させていただきたいのですが、可能ですか。"
  - id: 35
    speaker: "田中 誠"
    text: "承知しました。非常停止インターロックの追加確認ですね、問題ございません。この場で追加の動作確認を実施いたします。"
  - id: 36
    speaker: "鈴木 舞"
    text: "非常停止ボタンを押下します。……はい、主回路が瞬時に遮断され、再投入もインターロックにより阻止されることを確認しました。"
  - id: 37
    speaker: "山田 隆"
    text: "確認できました。インターロックの動作は問題ないですね。この件は合意ということでお願いします。"
  - id: 38
    speaker: "田中 誠"
    text: "ありがとうございます。非常停止インターロックの追加確認、合意ということで承知しました。"

  # ── ⑥絶縁抵抗の再協議(状態: 合意済みに更新) ────────────
  - id: 39
    speaker: "田中 誠"
    text: "すみません、先ほどの絶縁抵抗の件なんですが、休憩中に技術部へ電話で確認が取れましたので、この場でご報告させてください。"
  - id: 40
    speaker: "山田 隆"
    text: "はい、お願いします。"
  - id: 41
    speaker: "田中 誠"
    text: "先ほどの絶縁抵抗3.2メグオームの件、技術部に確認しましたところ、測定時の室内湿度がやや高めであったことが影響しており、社内規格の3メグオームは満たしているため、性能上問題ないとの回答をもらいました。"
  - id: 42
    speaker: "佐藤 健二"
    text: "なるほど、湿度の影響ということですね。数値としては規格を満たしているというのは変わらないわけですし。"
  - id: 43
    speaker: "山田 隆"
    text: "分かりました。それでは絶縁抵抗の件は、規格内ということで、合意とさせていただきます。先ほどの継続協議は解消ということで結構です。"
  - id: 44
    speaker: "田中 誠"
    text: "ありがとうございます。絶縁抵抗の件、合意ということで承知いたしました。"

  # ── ⑦銘板・附属図書確認 ─────────────────────────
  - id: 45
    speaker: "鈴木 舞"
    text: "それでは最後になりますが、銘板と附属図書の確認をお願いいたします。盤の銘板をご覧ください。"
  - id: 46
    speaker: "佐藤 健二"
    text: "銘板、拝見します。……あ、型式の表記が、SWB-2200のところ、SWB-2002になっていますね。桁が入れ替わっています。"
  - id: 47
    speaker: "田中 誠"
    text: "大変失礼いたしました。確認します。……申し訳ございません、ご指摘の通り誤記がございます。銘板を至急再発行いたします。"
  - id: 48
    speaker: "山田 隆"
    text: "出荷までには間に合いますか。"
  - id: 49
    speaker: "田中 誠"
    text: "はい、出荷日の8月20日までには、正しい型式表記の銘板に貼り替えて対応いたします。"
  - id: 50
    speaker: "山田 隆"
    text: "承知しました。では銘板の再発行は自社側対応、8月20日の出荷日までにお願いします。"
  - id: 51
    speaker: "佐藤 健二"
    text: "それと、取扱説明書と完成図書一式なんですが、まだこちらには届いていないようなのですが、いつ頃いただけますか。"
  - id: 52
    speaker: "鈴木 舞"
    text: "申し訳ございません、完成図書は現在最終校正中でして、7月25日までには一式お送りできる見込みです。"
  - id: 53
    speaker: "山田 隆"
    text: "分かりました。では完成図書の送付は7月25日までということでお願いします。"
  - id: 54
    speaker: "田中 誠"
    text: "承知しました。7月25日までに完成図書一式を送付いたします。"

  # ── ⑧閉会・次回スケジュール確認 ────────────────────
  - id: 55
    speaker: "田中 誠"
    text: "以上で本日予定しておりました試験項目はすべて完了となります。本日は誠にありがとうございました。"
  - id: 56
    speaker: "山田 隆"
    text: "お疲れ様でした。それでは、表示灯の交換が7月10日、絶縁抵抗の件は合意、銘板再発行が8月20日の出荷日まで、完成図書が7月25日まで、ということで確認しました。"
  - id: 57
    speaker: "田中 誠"
    text: "はい、その通りでございます。次回は8月20日の出荷検査の際に、あらためて確認させていただければと思います。"
  - id: 58
    speaker: "佐藤 健二"
    text: "承知しました。それでは出荷検査の日程は追ってご連絡いただくということで。"
  - id: 59
    speaker: "鈴木 舞"
    text: "はい、日程が確定次第ご連絡いたします。本日はありがとうございました。"
  - id: 60
    speaker: "山田 隆"
    text: "ありがとうございました。失礼します。"
