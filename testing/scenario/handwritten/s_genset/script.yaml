# 最終確認用の手書き台本: 非常用ディーゼル発電設備 工場立会試験
# 協議ブロック集(scenario/bank/)・生成器を使わずに書いた、これまでと異なる題材・話し方の台本。
# フィラー(えーと、あのー)、数値の言い直し、状態の変化(継続協議→合意、合意→撤回)、保留、
# 相手方が持つ対応、相対的な期限、雑談を含む。自社側は2名ともBTイヤホンを装着する想定。
meta:
  trial_name: 非常用ディーゼル発電設備(型式 EG-500) 工場立会試験
  location: 発電機工場 負荷試験場
  date: 2026年9月28日
  client_attendees: [小野寺 恵子, 石川 雄一]
  our_attendees: [田村 翔, 森 さやか]
  bt_wearers: [田村 翔, 森 さやか]
  bt_wearer: 田村 翔
speakers:
  小野寺 恵子: client
  石川 雄一: client
  田村 翔: our_side
  森 さやか: our_side
turns:
- {id: 1, speaker: 田村 翔, text: えー、皆さまお揃いですので、非常用ディーゼル発電設備の工場立会試験を始めます。本日はよろしくお願いいたします。}
- {id: 2, speaker: 小野寺 恵子, text: よろしくお願いします。今日は負荷試験まで全部見られる予定ですよね。}
- {id: 3, speaker: 田村 翔, text: はい、午前中に始動と負荷試験、午後に自動切替盤と保護装置の確認を予定しています。}
- {id: 4, speaker: 森 さやか, text: まず始動時間の確認です。起動信号を入れてから定格電圧が確立するまでの時間を測ります。}
- {id: 5, speaker: 森 さやか, text: 起動信号を入れます。…はい、確立しました。9.4秒です。}
- {id: 6, speaker: 石川 雄一, text: 規定は40秒以内でしたね。十分余裕があります。3回やってもらえますか。}
- {id: 7, speaker: 森 さやか, text: はい。2回目が9.1秒、3回目が9.6秒でした。}
- {id: 8, speaker: 石川 雄一, text: ばらつきも小さいですね。始動時間は合格とします。}
- {id: 9, speaker: 田村 翔, text: 続いて負荷試験に移ります。定格出力500キロボルトアンペアで30分間運転します。}
- {id: 10, speaker: 田村 翔, text: えーと、30分経過しました。冷却水の出口温度は82度で安定しています。排気温度は480度です。}
- {id: 11, speaker: 小野寺 恵子, text: 冷却水の上限は何度でしたか。}
- {id: 12, speaker: 田村 翔, text: 警報が95度、停止が100度ですので、十分下回っています。}
- {id: 13, speaker: 小野寺 恵子, text: わかりました。負荷試験は合格で合意とします。}
- {id: 14, speaker: 森 さやか, text: 次は電圧変動率です。0から100パーセントの負荷を一度に投入したときの瞬時電圧低下を測ります。}
- {id: 15, speaker: 森 さやか, text: 投入します。…瞬時電圧低下は18パーセント、回復時間は1.2秒でした。}
- {id: 16, speaker: 石川 雄一, text: 仕様は20パーセント以下ですよね。合格ではありますが、ちょっと余裕が少ないなあ。}
- {id: 17, speaker: 石川 雄一, text: うちの設備は大きなポンプを直入れで始動するので、実際はもっと下がるかもしれません。}
- {id: 18, speaker: 田村 翔, text: 波形を記録していますので、ポンプの始動電流で換算した値を後ほどお示しします。}
- {id: 19, speaker: 石川 雄一, text: それを見てから判断したいので、電圧変動率は継続協議にしてください。}
- {id: 20, speaker: 田村 翔, text: 承知しました。}
- {id: 21, speaker: 森 さやか, text: 周波数の確認です。定格負荷で50.02ヘルツ、無負荷で50.8ヘルツでした。整定の範囲内です。}
- {id: 22, speaker: 小野寺 恵子, text: はい、問題ありません。}
- {id: 23, speaker: 田村 翔, text: 燃料消費率ですが、定格負荷での実測は1キロワット時あたり238グラムでした。}
- {id: 24, speaker: 小野寺 恵子, text: 保証値は235グラムですよね。少し超えています。}
- {id: 25, speaker: 田村 翔, text: 測定の許容差はプラス5パーセントですので、許容差の範囲には入っています。}
- {id: 26, speaker: 小野寺 恵子, text: 契約書で許容差がどう書かれているか、こちらで確認します。来週中にご連絡しますので、それまでこの件は保留でお願いします。}
- {id: 27, speaker: 田村 翔, text: 承知しました。ご連絡をお待ちします。}
- {id: 28, speaker: 石川 雄一, text: ところで、今日は駅前でお祭りをやっているんですね。来るときに屋台がたくさん出ていました。}
- {id: 29, speaker: 森 さやか, text: 毎年この時期なんです。夕方からは道が混むので、お帰りは少し早めがいいかもしれません。}
- {id: 30, speaker: 石川 雄一, text: そうします。}
- {id: 31, speaker: 田村 翔, text: それでは、ここで一度休憩にします。午後は自動切替盤から再開します。}
- {id: 32, speaker: 森 さやか, text: 再開します。自動切替盤、ATSの切替時間の確認です。商用電源の停電を模擬して、発電機側へ切り替わるまでの時間を測ります。}
- {id: 33, speaker: 森 さやか, text: 切替時間は0.6秒でした。}
- {id: 34, speaker: 石川 雄一, text: 当社の他の設備は0.5秒以内でそろえているんです。短くできますか。}
- {id: 35, speaker: 田村 翔, text: 補助リレーの時限設定を変えれば短くできます。来週の水曜日までに設定を変更して、試験成績書を再提出します。}
- {id: 36, speaker: 石川 雄一, text: それでお願いします。切替時間の件は合意とします。}
- {id: 37, speaker: 小野寺 恵子, text: それから、排気管の断熱材ですが、フランジの近くの継ぎ目に隙間がありますね。}
- {id: 38, speaker: 森 さやか, text: あ、本当ですね。施工の不備です。今月中に巻き直して、写真でご報告します。}
- {id: 39, speaker: 小野寺 恵子, text: お願いします。}
- {id: 40, speaker: 田村 翔, text: 保護装置の確認で、過速度トリップ試験を行います。定格回転数は毎分1500回転、トリップの設定は115パーセントです。}
- {id: 41, speaker: 田村 翔, text: 回転数を上げます。…トリップしました。毎分1719回転、あ、失礼しました、1725回転です。設定どおりです。}
- {id: 42, speaker: 石川 雄一, text: 1725回転ですね。記録してください。過速度トリップは合格です。}
- {id: 43, speaker: 小野寺 恵子, text: もう一つお願いがあります。操作盤の表示ですが、英語表示にも切り替えられるようにしたいんです。海外から来る保守の人が使うので。}
- {id: 44, speaker: 田村 翔, text: ソフトの改修が必要になりますので、費用が別途かかります。10月14日までにお見積もりをお出しします。}
- {id: 45, speaker: 小野寺 恵子, text: 見積もりを見てから決めます。表示の件は継続協議にしましょう。}
- {id: 46, speaker: 田村 翔, text: 先ほど継続協議になった電圧変動率の件ですが、波形からポンプの始動電流で換算すると、瞬時電圧低下は19パーセントでした。}
- {id: 47, speaker: 田村 翔, text: ポンプを始動しても仕様の20パーセント以内に収まります。}
- {id: 48, speaker: 石川 雄一, text: 換算の根拠も見せていただきましたし、問題ないですね。電圧変動率は合意とします。}
- {id: 49, speaker: 小野寺 恵子, text: すみません、今、本社から連絡がありまして。午前中に合意した負荷試験の件なんですが。}
- {id: 50, speaker: 小野寺 恵子, text: 冷却水温度の記録が、30分のうち最初の5分だけ抜けていたそうで、記録として不完全なので、負荷試験は合意を取り消して継続協議に戻させてください。}
- {id: 51, speaker: 田村 翔, text: 申し訳ありません。データロガーの設定を確認して、記録の欠けている部分を補えるか調べます。10月2日までにご報告します。}
- {id: 52, speaker: 小野寺 恵子, text: よろしくお願いします。}
- {id: 53, speaker: 田村 翔, text: 本日予定していた項目は以上です。宿題になった項目は議事録にまとめてお送りします。}
- {id: 54, speaker: 石川 雄一, text: ありがとうございました。お疲れさまでした。}
