# 全題材共通の部品(scenario/generate_scenario.py が読む)

# 開会・閉会(議事録の協議事項には出てこない想定)
opening:
  - {r: our, t: "それでは時間になりましたので、{trial_name}を始めさせていただきます。本日はよろしくお願いいたします。"}
  - {r: client, t: "よろしくお願いします。"}
  - {r: our, t: "本日の試験項目は、お配りした試験要領書のとおりです。順番に進めてまいります。"}
closing:
  - {r: our, t: "本日予定していた項目は以上です。残った課題は議事録にまとめて送付いたします。"}
  - {r: client, t: "ありがとうございました。お疲れさまでした。"}

# 雑談・脱線(議事録に出てきてはいけない。keywordsが議事録に出たら混入とみなす)
chitchat:
  - id: cc_weather
    keywords: ["台風", "天気"]
    turns:
      - {r: client, t: "そういえば、週末に台風が来るみたいですね。"}
      - {r: our, t: "そうなんですよ。帰りの新幹線が止まらないといいんですが。"}
      - {r: client, t: "早めに帰った方がいいかもしれませんね。"}
  - id: cc_lunch
    keywords: ["食堂", "カレー", "昼食"]
    turns:
      - {r: our, t: "お昼は食堂を用意していますので、休憩のときにご案内します。"}
      - {r: client, t: "ありがとうございます。ここの食堂はカレーが有名だと聞きました。"}
      - {r: our, t: "そうなんです、金曜日だけ出るんですよ。"}
  - id: cc_traffic
    keywords: ["渋滞", "高速"]
    turns:
      - {r: client, t: "今朝は高速の渋滞がひどくて、ぎりぎりになってしまいました。"}
      - {r: our, t: "事故があったみたいですね。無事に着かれてよかったです。"}
  - id: cc_baseball
    keywords: ["野球", "優勝"]
    turns:
      - {r: our, t: "昨日の野球は見ましたか。"}
      - {r: client, t: "見ましたよ。あのまま優勝まで行ってほしいですね。"}
      - {r: our, t: "本当ですね。今年は期待できそうです。"}
  - id: cc_old_project
    keywords: ["十年前", "10年前"]
    turns:
      - {r: client, t: "この試験室、十年前に別の案件で来たことがあるんですよ。"}
      - {r: our, t: "そうでしたか。その後で床と照明を改修しているので、雰囲気が変わったと思います。"}
  - id: cc_phone
    keywords: ["電話"]
    turns:
      - {r: client, t: "すみません、会社から電話が入ったので少し外します。"}
      - {r: our, t: "どうぞ。戻られたら続きを始めます。"}
  - id: cc_parking
    keywords: ["駐車場", "駐車"]
    turns:
      - {r: our, t: "お車は来客用の駐車場に止められましたか。"}
      - {r: client, t: "はい、守衛所で案内してもらいました。"}
  - id: cc_coffee
    keywords: ["コーヒー", "自販機"]
    turns:
      - {r: our, t: "飲み物は試験室の外の自販機をご自由にお使いください。"}
      - {r: client, t: "ありがとうございます。あとでコーヒーでもいただきます。"}

# 相槌(相手の発話の途中や直後に重ねて入れる)
backchannels: ["はい", "ええ", "なるほど", "はい、はい", "そうですね", "承知しました", "ええ、ええ"]

# 合意済みの協議を後から撤回するターン({name} にブロックの name が入る)
retract_turns:
  - {r: client, t: "すみません、先ほど合意とした{name}の件ですが、社内で確認したところ条件を見直したいという話になりました。"}
  - {r: client, t: "申し訳ないですが、{name}は合意を取り消して、継続協議に戻させてください。"}
  - {r: our, t: "承知しました。{name}は継続協議に戻して、改めてご相談させてください。"}

# 期限の相対表現。meta_date(2026年10月1日 木曜)を基準にした正解日付を持つ
relative_deadlines:
  - {text: "来週の金曜日", accept: ["来週", "金曜", "10月9日", "10/9"]}
  - {text: "今月末", accept: ["月末", "10月31日", "10/31"]}
  - {text: "2週間後", accept: ["2週間", "二週間", "10月15日", "10/15"]}
  - {text: "次回の立会試験", accept: ["次回"]}
