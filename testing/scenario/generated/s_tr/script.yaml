meta:
  trial_name: 油入変圧器(型式 TR-5000 10MVA) 工場立会試験
  location: 変圧器工場 大型試験場
  date: 2026年10月1日
  client_attendees:
  - 山田 隆
  - 佐藤 健二
  our_attendees:
  - 田中 誠
  - 鈴木 舞
  bt_wearers:
  - 田中 誠
  bt_wearer: 田中 誠
speakers:
  山田 隆: client
  佐藤 健二: client
  田中 誠: our_side
  鈴木 舞: our_side
turns:
- id: 1
  speaker: 鈴木 舞
  text: それでは時間になりましたので、油入変圧器(型式 TR-5000 10MVA) 工場立会試験を始めさせていただきます。本日はよろしくお願いいたします。
  kind: opening
  block: null
- id: 2
  speaker: 佐藤 健二
  text: よろしくお願いします。
  kind: opening
  block: null
- id: 3
  speaker: 鈴木 舞
  text: 本日の試験項目は、お配りした試験要領書のとおりです。順番に進めてまいります。
  kind: opening
  block: null
- id: 4
  speaker: 鈴木 舞
  text: 変圧比試験の結果です。一次66キロボルト、二次6.6キロボルトで、全タップの比誤差は最大0.2パーセントでした。
  kind: block
  block: tr_ratio
- id: 5
  speaker: 佐藤 健二
  text: 規格の許容差はプラスマイナス0.5パーセントでしたね。
  kind: block
  block: tr_ratio
- id: 6
  speaker: 鈴木 舞
  text: はい、すべてのタップで許容差内です。極性と角変位も確認済みです。
  kind: block
  block: tr_ratio
- id: 7
  speaker: 佐藤 健二
  text: 了解しました。変圧比試験は合格とします。
  kind: block
  block: tr_ratio
- id: 8
  speaker: 田中 誠
  text: 無負荷損の測定値は8.4キロワットでした。
  kind: block
  block: tr_noload
- id: 9
  speaker: 山田 隆
  text: 保証値は8.0キロワットですよね。5パーセント超えています。
  kind: block
  block: tr_noload
- id: 10
  speaker: 田中 誠
  text: JECの規格では無負荷損の許容差はプラス15パーセントですので、規格上は合格です。
  kind: block
  block: tr_noload
- id: 11
  speaker: 山田 隆
  text: ただ、契約上は保証値で評価することになっているはずです。契約書を確認するまで継続協議にさせてください。
  kind: block
  block: tr_noload
- id: 12
  speaker: 田中 誠
  text: 承知しました。こちらでも契約の条項を確認します。
  kind: block
  block: tr_noload
- id: 13
  speaker: 鈴木 舞
  text: 負荷損と短絡インピーダンスの測定です。インピーダンスは7.4パーセントで、仕様の7.5パーセントに対して許容差内です。
  kind: block
  block: tr_impedance
- id: 14
  speaker: 山田 隆
  text: 負荷損の方は保証値以内ですか。
  kind: block
  block: tr_impedance
- id: 15
  speaker: 鈴木 舞
  text: はい、保証値62キロワットに対して59.8キロワットでした。
  kind: block
  block: tr_impedance
- id: 16
  speaker: 山田 隆
  text: 問題ないですね。合格です。
  kind: block
  block: tr_impedance
- id: 17
  speaker: 田中 誠
  text: 温度上昇試験の結果です。油の温度上昇は52ケルビン、巻線は63ケルビンでした。限度はそれぞれ55と65ケルビンです。
  kind: block
  block: tr_temp
- id: 18
  speaker: 佐藤 健二
  text: 巻線の余裕が2ケルビンしかないですね。夏場の運転が心配です。
  kind: block
  block: tr_temp
- id: 19
  speaker: 田中 誠
  text: 設置場所の周囲温度の条件は仕様に織り込み済みですので、夏季でも限度は超えない設計です。
  kind: block
  block: tr_temp
- id: 20
  speaker: 佐藤 健二
  text: 運転部門の意見も聞きたいので、この項目は判断を保留させてください。
  kind: block
  block: tr_temp
- id: 21
  speaker: 田中 誠
  text: 承知しました。計算書を追加でお送りします。
  kind: block
  block: tr_temp
- id: 22
  speaker: 佐藤 健二
  text: 先ほどの無負荷損の件、本社に確認したところ、契約書に規格の許容差を適用すると書いてありました。
  kind: resolve
  block: tr_noload
- id: 23
  speaker: 佐藤 健二
  text: なので8.4キロワットで問題ありません。無負荷損は合意とします。
  kind: resolve
  block: tr_noload
- id: 24
  speaker: 田中 誠
  text: ありがとうございます。記録にもそのように残します。
  kind: resolve
  block: tr_noload
- id: 25
  speaker: 山田 隆
  text: 放熱器の下側のフランジから、少し油がにじんでいませんか。
  kind: block
  block: tr_oil_leak
- id: 26
  speaker: 田中 誠
  text: 確認しました。パッキンの締め付け不足のようです。
  kind: block
  block: tr_oil_leak
- id: 27
  speaker: 田中 誠
  text: パッキンを交換したうえで、10月12日までに油漏れ試験をやり直します。
  kind: block
  block: tr_oil_leak
- id: 28
  speaker: 山田 隆
  text: やり直しの結果は書面でください。それで了承します。
  kind: block
  block: tr_oil_leak
- id: 29
  speaker: 鈴木 舞
  text: 騒音測定の結果は、変圧器から0.3メートルの位置の平均で68デシベルでした。
  kind: block
  block: tr_noise
- id: 30
  speaker: 山田 隆
  text: 仕様は70デシベル以下ですから問題ないですね。暗騒音はどのくらいでしたか。
  kind: block
  block: tr_noise
- id: 31
  speaker: 鈴木 舞
  text: 暗騒音は45デシベルで、補正は不要でした。
  kind: block
  block: tr_noise
- id: 32
  speaker: 山田 隆
  text: 分かりました。騒音は合格です。
  kind: block
  block: tr_noise
- id: 33
  speaker: 佐藤 健二
  text: 負荷時タップ切換器の動作回数カウンターですが、数字が一桁欠けて表示されていますね。
  kind: block
  block: tr_tap_counter
- id: 34
  speaker: 田中 誠
  text: 表示部の不良です。カウンターを新品に交換します。
  kind: block
  block: tr_tap_counter
- id: 35
  speaker: 佐藤 健二
  text: 交換はいつになりますか。
  kind: block
  block: tr_tap_counter
- id: 36
  speaker: 田中 誠
  text: 部品の入手に時間がかかるので、10月20日までに交換します。
  kind: block
  block: tr_tap_counter
- id: 37
  speaker: 佐藤 健二
  text: 了解です。
  kind: block
  block: tr_tap_counter
- id: 38
  speaker: 山田 隆
  text: 温度上昇試験の前後で、絶縁油の油中ガス分析はやっていますか。
  kind: block
  block: tr_dga
- id: 39
  speaker: 田中 誠
  text: はい、サンプルは採取済みです。外部の分析機関に出していますので、結果はまだです。
  kind: block
  block: tr_dga
- id: 40
  speaker: 田中 誠
  text: 10月21日までに分析結果をお送りします。
  kind: block
  block: tr_dga
- id: 41
  speaker: 山田 隆
  text: では結果を見るまで、この項目は保留にしておきます。
  kind: block
  block: tr_dga
- id: 42
  speaker: 田中 誠
  text: 外装の塗装膜厚は平均85ミクロンで、仕様の80ミクロン以上を満たしています。
  kind: block
  block: tr_paint
- id: 43
  speaker: 山田 隆
  text: 記録を見ると、タンクの角の1点だけ72ミクロンになっていますね。
  kind: block
  block: tr_paint
- id: 44
  speaker: 田中 誠
  text: その箇所は出荷前に補修塗装して、再測定します。
  kind: block
  block: tr_paint
- id: 45
  speaker: 山田 隆
  text: それで結構です。
  kind: block
  block: tr_paint
- id: 46
  speaker: 佐藤 健二
  text: 付属品のダイヤル温度計ですが、目盛りが細かくて離れた位置から読みにくいです。
  kind: block
  block: tr_thermometer
- id: 47
  speaker: 鈴木 舞
  text: 標準品を使っていますが、目盛り板の大きいタイプに変更することはできます。
  kind: block
  block: tr_thermometer
- id: 48
  speaker: 佐藤 健二
  text: 変更した場合の納期への影響を教えてください。それを聞いてから決めたいので継続協議でお願いします。
  kind: block
  block: tr_thermometer
- id: 49
  speaker: 鈴木 舞
  text: 分かりました。メーカーに確認します。
  kind: block
  block: tr_thermometer
- id: 50
  speaker: 鈴木 舞
  text: 本日予定していた項目は以上です。残った課題は議事録にまとめて送付いたします。
  kind: closing
  block: null
- id: 51
  speaker: 山田 隆
  text: ありがとうございました。お疲れさまでした。
  kind: closing
  block: null
