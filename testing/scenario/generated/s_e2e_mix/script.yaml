meta:
  trial_name: 油入変圧器(型式 TR-5000 10MVA) 工場立会試験
  location: 変圧器工場 大型試験場
  date: 2026年10月1日
  client_attendees:
  - 山田 隆
  - 佐藤 健二
  our_attendees:
  - 田中 誠
  - 鈴木 舞
  bt_wearers:
  - 田中 誠
  bt_wearer: 田中 誠
speakers:
  山田 隆: client
  佐藤 健二: client
  田中 誠: our_side
  鈴木 舞: our_side
turns:
- id: 1
  speaker: 鈴木 舞
  text: それでは時間になりましたので、油入変圧器(型式 TR-5000 10MVA) 工場立会試験を始めさせていただきます。本日はよろしくお願いいたします。
  kind: opening
  block: null
- id: 2
  speaker: 山田 隆
  text: よろしくお願いします。
  kind: opening
  block: null
- id: 3
  speaker: 鈴木 舞
  text: 本日の試験項目は、お配りした試験要領書のとおりです。順番に進めてまいります。
  kind: opening
  block: null
- id: 4
  speaker: 田中 誠
  text: 変圧比試験の結果です。一次66キロボルト、二次6.6キロボルトで、全タップの比誤差は最大0.2パーセントでした。
  kind: block
  block: tr_ratio
- id: 5
  speaker: 山田 隆
  text: 規格の許容差はプラスマイナス0.5パーセントでしたね。
  kind: block
  block: tr_ratio
- id: 6
  speaker: 田中 誠
  text: はい、すべてのタップで許容差内です。極性と角変位も確認済みです。
  kind: block
  block: tr_ratio
- id: 7
  speaker: 山田 隆
  text: 了解しました。変圧比試験は合格とします。
  kind: block
  block: tr_ratio
- id: 8
  speaker: 鈴木 舞
  text: 無負荷損の測定値は8.4キロワットでした。
  kind: block
  block: tr_noload
- id: 9
  speaker: 佐藤 健二
  text: 保証値は8.0キロワットですよね。5パーセント超えています。
  kind: block
  block: tr_noload
- id: 10
  speaker: 鈴木 舞
  text: JECの規格では無負荷損の許容差はプラス15パーセントですので、規格上は合格です。
  kind: block
  block: tr_noload
- id: 11
  speaker: 佐藤 健二
  text: ただ、契約上は保証値で評価することになっているはずです。契約書を確認するまで継続協議にさせてください。
  kind: block
  block: tr_noload
- id: 12
  speaker: 鈴木 舞
  text: 承知しました。こちらでも契約の条項を確認します。
  kind: block
  block: tr_noload
- id: 13
  speaker: 鈴木 舞
  text: 温度上昇試験の結果です。油の温度上昇は52ケルビン、巻線は63ケルビンでした。限度はそれぞれ55と65ケルビンです。
  kind: block
  block: tr_temp
- id: 14
  speaker: 佐藤 健二
  text: 巻線の余裕が2ケルビンしかないですね。夏場の運転が心配です。
  kind: block
  block: tr_temp
- id: 15
  speaker: 鈴木 舞
  text: 設置場所の周囲温度の条件は仕様に織り込み済みですので、夏季でも限度は超えない設計です。
  kind: block
  block: tr_temp
- id: 16
  speaker: 佐藤 健二
  text: 運転部門の意見も聞きたいので、この項目は判断を保留させてください。
  kind: block
  block: tr_temp
- id: 17
  speaker: 鈴木 舞
  text: 承知しました。計算書を追加でお送りします。
  kind: block
  block: tr_temp
- id: 18
  speaker: 山田 隆
  text: 放熱器の下側のフランジから、少し油がにじんでいませんか。
  kind: block
  block: tr_oil_leak
- id: 19
  speaker: 鈴木 舞
  text: 確認しました。パッキンの締め付け不足のようです。
  kind: block
  block: tr_oil_leak
- id: 20
  speaker: 鈴木 舞
  text: パッキンを交換したうえで、来週の金曜日までに油漏れ試験をやり直します。
  kind: block
  block: tr_oil_leak
- id: 21
  speaker: 山田 隆
  text: やり直しの結果は書面でください。それで了承します。
  kind: block
  block: tr_oil_leak
- id: 22
  speaker: 山田 隆
  text: 温度上昇試験の前後で、絶縁油の油中ガス分析はやっていますか。
  kind: block
  block: tr_dga
- id: 23
  speaker: 田中 誠
  text: はい、サンプルは採取済みです。外部の分析機関に出していますので、結果はまだです。
  kind: block
  block: tr_dga
- id: 24
  speaker: 田中 誠
  text: 今月末までに分析結果をお送りします。
  kind: block
  block: tr_dga
- id: 25
  speaker: 山田 隆
  text: では結果を見るまで、この項目は保留にしておきます。
  kind: block
  block: tr_dga
- id: 26
  speaker: 山田 隆
  text: 先ほどの無負荷損の件、本社に確認したところ、契約書に規格の許容差を適用すると書いてありました。
  kind: resolve
  block: tr_noload
- id: 27
  speaker: 山田 隆
  text: なので8.4キロワットで問題ありません。無負荷損は合意とします。
  kind: resolve
  block: tr_noload
- id: 28
  speaker: 鈴木 舞
  text: ありがとうございます。記録にもそのように残します。
  kind: resolve
  block: tr_noload
- id: 29
  speaker: 田中 誠
  text: 外装の塗装膜厚は平均85ミクロンで、仕様の80ミクロン以上を満たしています。
  kind: block
  block: tr_paint
- id: 30
  speaker: 山田 隆
  text: 記録を見ると、タンクの角の1点だけ72ミクロンになっていますね。
  kind: block
  block: tr_paint
- id: 31
  speaker: 田中 誠
  text: その箇所は出荷前に補修塗装して、再測定します。
  kind: block
  block: tr_paint
- id: 32
  speaker: 山田 隆
  text: それで結構です。
  kind: block
  block: tr_paint
- id: 33
  speaker: 山田 隆
  text: 警報一覧の画面ですが、重故障は赤の点滅にしてもらえますか。今は軽故障と同じ表示で区別がつきにくいです。
  kind: block
  block: plc_alarm
- id: 34
  speaker: 鈴木 舞
  text: 画面の設定変更で対応できます。10月8日までに修正版をお送りします。
  kind: block
  block: plc_alarm
- id: 35
  speaker: 山田 隆
  text: ありがとうございます。それでお願いします。
  kind: block
  block: plc_alarm
- id: 36
  speaker: 山田 隆
  text: トレンドデータの保存期間が30日になっていますが、水質の管理上、1年は残したいんです。
  kind: block
  block: plc_trend
- id: 37
  speaker: 鈴木 舞
  text: 1年分を保存するにはストレージの増設が必要になります。
  kind: block
  block: plc_trend
- id: 38
  speaker: 山田 隆
  text: 増設の費用と、外部に書き出す方法があるかも含めて検討したいので、継続協議でお願いします。
  kind: block
  block: plc_trend
- id: 39
  speaker: 鈴木 舞
  text: 承知しました。両方の案を比較してお示しします。
  kind: block
  block: plc_trend
- id: 40
  speaker: 山田 隆
  text: すみません、会社から電話が入ったので少し外します。
  kind: chitchat
  block: cc_phone
- id: 41
  speaker: 鈴木 舞
  text: どうぞ。戻られたら続きを始めます。
  kind: chitchat
  block: cc_phone
- id: 42
  speaker: 田中 誠
  text: CPUの二重化切替試験です。稼働系の電源を切って、待機系に切り替わるまでの時間を測ります。
  kind: block
  block: plc_redundancy
- id: 43
  speaker: 田中 誠
  text: 切替時間は120ミリ秒でした。仕様は200ミリ秒以内です。
  kind: block
  block: plc_redundancy
- id: 44
  speaker: 佐藤 健二
  text: 切替のときに出力が変化しないことも確認できましたか。
  kind: block
  block: plc_redundancy
- id: 45
  speaker: 田中 誠
  text: はい、出力は保持されていました。
  kind: block
  block: plc_redundancy
- id: 46
  speaker: 佐藤 健二
  text: 合格です。
  kind: block
  block: plc_redundancy
- id: 47
  speaker: 佐藤 健二
  text: 今朝は高速の渋滞がひどくて、ぎりぎりになってしまいました。
  kind: chitchat
  block: cc_traffic
- id: 48
  speaker: 鈴木 舞
  text: 事故があったみたいですね。無事に着かれてよかったです。
  kind: chitchat
  block: cc_traffic
- id: 49
  speaker: 佐藤 健二
  text: 上位の監視システムとの通信で、さっき一度タイムアウトが出ていましたね。
  kind: block
  block: plc_modbus
- id: 50
  speaker: 鈴木 舞
  text: はい、1回だけ発生しました。原因はまだ分かっていません。
  kind: block
  block: plc_modbus
- id: 51
  speaker: 鈴木 舞
  text: 10月15日までに原因を調査して報告します。
  kind: block
  block: plc_modbus
- id: 52
  speaker: 佐藤 健二
  text: 原因が分かるまで継続協議にします。
  kind: block
  block: plc_modbus
- id: 53
  speaker: 山田 隆
  text: すみません、先ほど合意とした塗装膜厚の件ですが、社内で確認したところ条件を見直したいという話になりました。
  kind: retract
  block: tr_paint
- id: 54
  speaker: 山田 隆
  text: 申し訳ないですが、塗装膜厚は合意を取り消して、継続協議に戻させてください。
  kind: retract
  block: tr_paint
- id: 55
  speaker: 田中 誠
  text: 承知しました。塗装膜厚は継続協議に戻して、改めてご相談させてください。
  kind: retract
  block: tr_paint
- id: 56
  speaker: 田中 誠
  text: トレンドの保存期間の件、外付けのストレージで1年分を保存する案なら、追加費用は小さく済みます。
  kind: resolve
  block: plc_trend
- id: 57
  speaker: 山田 隆
  text: それなら外付けストレージの案で進めてください。トレンドの件は合意とします。
  kind: resolve
  block: plc_trend
- id: 58
  speaker: 山田 隆
  text: 操作権限がオペレーターと管理者の2段階ですが、保守員を加えて3段階にしたいです。
  kind: block
  block: plc_user_level
- id: 59
  speaker: 鈴木 舞
  text: 対応できます。保守員の権限でできる操作の一覧をいただけますか。
  kind: block
  block: plc_user_level
- id: 60
  speaker: 山田 隆
  text: 一覧は今週中に送ります。
  kind: block
  block: plc_user_level
- id: 61
  speaker: 鈴木 舞
  text: ありがとうございます。一覧をいただいてから、10月22日までに画面を改修します。
  kind: block
  block: plc_user_level
- id: 62
  speaker: 山田 隆
  text: それでお願いします。
  kind: block
  block: plc_user_level
- id: 63
  speaker: 佐藤 健二
  text: 監視画面の時計が、上位システムと3秒ずれていますね。
  kind: block
  block: plc_time_sync
- id: 64
  speaker: 鈴木 舞
  text: 時刻同期の設定で、サーバーのアドレスが間違っていました。今修正しました。
  kind: block
  block: plc_time_sync
- id: 65
  speaker: 佐藤 健二
  text: 今は一致していますね。了解しました。
  kind: block
  block: plc_time_sync
- id: 66
  speaker: 鈴木 舞
  text: 本日予定していた項目は以上です。残った課題は議事録にまとめて送付いたします。
  kind: closing
  block: null
- id: 67
  speaker: 山田 隆
  text: ありがとうございました。お疲れさまでした。
  kind: closing
  block: null
