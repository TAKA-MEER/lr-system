- id: 1
  speaker: 鈴木 舞
  text: それでは時間になりましたので、閉鎖配電盤(型式 SWB-3300) 出荷前立会試験を始めさせていただきます。本日はよろしくお願いいたします。
  kind: opening
  block: null
- id: 2
  speaker: 山田 隆
  text: よろしくお願いします。
  kind: opening
  block: null
- id: 3
  speaker: 鈴木 舞
  text: 本日の試験項目は、お配りした試験要領書のとおりです。順番に進めてまいります。
  kind: opening
  block: null
- id: 4
  speaker: 山田 隆
  text: まず外観ですが、右側面の下のあたりに塗装のムラがありますね。光の当たり方で目立ちます。
  kind: block
  block: sg_appearance
- id: 5
  speaker: 田中 誠
  text: ご指摘ありがとうございます。確かにムラがありますので、右側面は出荷前に再塗装いたします。
  kind: block
  block: sg_appearance
- id: 6
  speaker: 山田 隆
  text: お願いします。いつ頃になりますか。
  kind: block
  block: sg_appearance
- id: 7
  speaker: 田中 誠
  text: 10月9日までに再塗装を完了させて、写真でご報告します。
  kind: block
  block: sg_appearance
