meta:
  trial_name: 閉鎖配電盤(型式 SWB-3300) 出荷前立会試験
  location: 第2工場 電気試験室
  date: 2026年10月1日
  client_attendees:
  - 山田 隆
  - 佐藤 健二
  our_attendees:
  - 田中 誠
  - 鈴木 舞
  bt_wearers:
  - 田中 誠
  bt_wearer: 田中 誠
speakers:
  山田 隆: client
  佐藤 健二: client
  田中 誠: our_side
  鈴木 舞: our_side
turns:
- id: 1
  speaker: 田中 誠
  text: それでは時間になりましたので、閉鎖配電盤(型式 SWB-3300) 出荷前立会試験を始めさせていただきます。本日はよろしくお願いいたします。
  kind: opening
  block: null
- id: 2
  speaker: 山田 隆
  text: よろしくお願いします。
  kind: opening
  block: null
- id: 3
  speaker: 田中 誠
  text: 本日の試験項目は、お配りした試験要領書のとおりです。順番に進めてまいります。
  kind: opening
  block: null
- id: 4
  speaker: 田中 誠
  text: 次に絶縁抵抗試験の結果です。主回路と大地間で3.2メガオームでした。
  kind: block
  block: sg_insulation
- id: 5
  speaker: 山田 隆
  text: 判定基準の下限は2メガオームですよね。合格ではありますが、余裕が少なくないですか。
  kind: block
  block: sg_insulation
- id: 6
  speaker: 田中 誠
  text: 本日は湿度が68パーセントと高く、その影響が出ていると考えています。
  kind: block
  block: sg_insulation
- id: 7
  speaker: 山田 隆
  text: それなら乾燥させてから再測定してもらえますか。それまではこの項目は継続協議にしておきましょう。
  kind: block
  block: sg_insulation
- id: 8
  speaker: 田中 誠
  text: 承知しました。除湿してから再測定します。
  kind: block
  block: sg_insulation
- id: 9
  speaker: 鈴木 舞
  text: インターロックの確認です。遮断器が投入状態のときに、断路器を操作できないことを確認します。
  kind: block
  block: sg_interlock
- id: 10
  speaker: 鈴木 舞
  text: ご覧のとおり、断路器のハンドルはロックされて動きません。
  kind: block
  block: sg_interlock
- id: 11
  speaker: 山田 隆
  text: 逆の条件、断路器が中間位置のときに遮断器が投入できないことも見せてください。
  kind: block
  block: sg_interlock
- id: 12
  speaker: 鈴木 舞
  text: はい。中間位置では投入指令を出しても遮断器は動作しません。
  kind: block
  block: sg_interlock
- id: 13
  speaker: 山田 隆
  text: 確認しました。インターロックは問題ありません。
  kind: block
  block: sg_interlock
- id: 14
  speaker: 田中 誠
  text: 負荷損と短絡インピーダンスの測定です。インピーダンスは7.4パーセントで、仕様の7.5パーセントに対して許容差内です。
  kind: block
  block: tr_impedance
- id: 15
  speaker: 山田 隆
  text: 負荷損の方は保証値以内ですか。
  kind: block
  block: tr_impedance
- id: 16
  speaker: 田中 誠
  text: はい、保証値62キロワットに対して59.8キロワットでした。
  kind: block
  block: tr_impedance
- id: 17
  speaker: 山田 隆
  text: 問題ないですね。合格です。
  kind: block
  block: tr_impedance
- id: 18
  speaker: 鈴木 舞
  text: 外装の塗装膜厚は平均85ミクロンで、仕様の80ミクロン以上を満たしています。
  kind: block
  block: tr_paint
- id: 19
  speaker: 佐藤 健二
  text: 記録を見ると、タンクの角の1点だけ72ミクロンになっていますね。
  kind: block
  block: tr_paint
- id: 20
  speaker: 鈴木 舞
  text: その箇所は出荷前に補修塗装して、再測定します。
  kind: block
  block: tr_paint
- id: 21
  speaker: 佐藤 健二
  text: それで結構です。
  kind: block
  block: tr_paint
- id: 22
  speaker: 田中 誠
  text: 先ほど継続協議になっていた絶縁抵抗の件ですが、除湿後に再測定したところ、45メガオームでした。
  kind: resolve
  block: sg_insulation
- id: 23
  speaker: 佐藤 健二
  text: 45メガオームなら十分ですね。絶縁抵抗は合格で合意とします。
  kind: resolve
  block: sg_insulation
- id: 24
  speaker: 田中 誠
  text: 損失の測定から算出した効率は96.2パーセントでした。保証値は96.0パーセントです。
  kind: block
  block: mt_efficiency
- id: 25
  speaker: 山田 隆
  text: IE3相当という条件も満たしていますか。
  kind: block
  block: mt_efficiency
- id: 26
  speaker: 田中 誠
  text: はい、IE3の効率値を上回っています。
  kind: block
  block: mt_efficiency
- id: 27
  speaker: 山田 隆
  text: 了解しました。効率は合格です。
  kind: block
  block: mt_efficiency
- id: 28
  speaker: 佐藤 健二
  text: 予備品として、軸受を1セット追加で購入したいと考えています。
  kind: block
  block: mt_spare
- id: 29
  speaker: 鈴木 舞
  text: 承知しました。10月16日までにお見積もりをお出しします。
  kind: block
  block: mt_spare
- id: 30
  speaker: 佐藤 健二
  text: 見積もりを見てから発注するか決めます。継続協議でお願いします。
  kind: block
  block: mt_spare
- id: 31
  speaker: 鈴木 舞
  text: CPUの二重化切替試験です。稼働系の電源を切って、待機系に切り替わるまでの時間を測ります。
  kind: block
  block: plc_redundancy
- id: 32
  speaker: 鈴木 舞
  text: 切替時間は120ミリ秒でした。仕様は200ミリ秒以内です。
  kind: block
  block: plc_redundancy
- id: 33
  speaker: 山田 隆
  text: 切替のときに出力が変化しないことも確認できましたか。
  kind: block
  block: plc_redundancy
- id: 34
  speaker: 鈴木 舞
  text: はい、出力は保持されていました。
  kind: block
  block: plc_redundancy
- id: 35
  speaker: 山田 隆
  text: 合格です。
  kind: block
  block: plc_redundancy
- id: 36
  speaker: 佐藤 健二
  text: 操作権限がオペレーターと管理者の2段階ですが、保守員を加えて3段階にしたいです。
  kind: block
  block: plc_user_level
- id: 37
  speaker: 鈴木 舞
  text: 対応できます。保守員の権限でできる操作の一覧をいただけますか。
  kind: block
  block: plc_user_level
- id: 38
  speaker: 佐藤 健二
  text: 一覧は今週中に送ります。
  kind: block
  block: plc_user_level
- id: 39
  speaker: 鈴木 舞
  text: ありがとうございます。一覧をいただいてから、10月22日までに画面を改修します。
  kind: block
  block: plc_user_level
- id: 40
  speaker: 佐藤 健二
  text: それでお願いします。
  kind: block
  block: plc_user_level
- id: 41
  speaker: 田中 誠
  text: 本日予定していた項目は以上です。残った課題は議事録にまとめて送付いたします。
  kind: closing
  block: null
- id: 42
  speaker: 山田 隆
  text: ありがとうございました。お疲れさまでした。
  kind: closing
  block: null
