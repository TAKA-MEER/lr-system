meta:
  trial_name: 閉鎖配電盤(型式 SWB-3300) 出荷前立会試験
  location: 第2工場 電気試験室
  date: 2026年10月1日
  client_attendees:
  - 山田 隆
  - 佐藤 健二
  our_attendees:
  - 田中 誠
  - 鈴木 舞
  bt_wearers:
  - 田中 誠
  bt_wearer: 田中 誠
speakers:
  山田 隆: client
  佐藤 健二: client
  田中 誠: our_side
  鈴木 舞: our_side
turns:
- id: 1
  speaker: 田中 誠
  text: それでは時間になりましたので、閉鎖配電盤(型式 SWB-3300) 出荷前立会試験を始めさせていただきます。本日はよろしくお願いいたします。
  kind: opening
  block: null
- id: 2
  speaker: 佐藤 健二
  text: よろしくお願いします。
  kind: opening
  block: null
- id: 3
  speaker: 田中 誠
  text: 本日の試験項目は、お配りした試験要領書のとおりです。順番に進めてまいります。
  kind: opening
  block: null
- id: 4
  speaker: 山田 隆
  text: まず外観ですが、右側面の下のあたりに塗装のムラがありますね。光の当たり方で目立ちます。
  kind: block
  block: sg_appearance
- id: 5
  speaker: 鈴木 舞
  text: ご指摘ありがとうございます。確かにムラがありますので、右側面は出荷前に再塗装いたします。
  kind: block
  block: sg_appearance
- id: 6
  speaker: 山田 隆
  text: お願いします。いつ頃になりますか。
  kind: block
  block: sg_appearance
- id: 7
  speaker: 鈴木 舞
  text: 10月9日までに再塗装を完了させて、写真でご報告します。
  kind: block
  block: sg_appearance
- id: 8
  speaker: 山田 隆
  text: 分かりました。それで結構です。
  kind: block
  block: sg_appearance
- id: 9
  speaker: 田中 誠
  text: 続いて寸法の確認です。盤の幅は図面で800ミリ、公差はプラスマイナス2ミリです。
  kind: block
  block: sg_dimension
- id: 10
  speaker: 田中 誠
  text: 実測は801.5ミリでした。公差の範囲に入っています。
  kind: block
  block: sg_dimension
- id: 11
  speaker: 佐藤 健二
  text: 奥行きと高さも図面どおりでしたか。
  kind: block
  block: sg_dimension
- id: 12
  speaker: 田中 誠
  text: はい、奥行き、高さとも図面どおりです。記録表にも記入しています。
  kind: block
  block: sg_dimension
- id: 13
  speaker: 佐藤 健二
  text: 了解です。寸法は問題ありません。
  kind: block
  block: sg_dimension
- id: 14
  speaker: 田中 誠
  text: 次に絶縁抵抗試験の結果です。主回路と大地間で3.2メガオームでした。
  kind: block
  block: sg_insulation
- id: 15
  speaker: 山田 隆
  text: 判定基準の下限は2メガオームですよね。合格ではありますが、余裕が少なくないですか。
  kind: block
  block: sg_insulation
- id: 16
  speaker: 田中 誠
  text: 本日は湿度が68パーセントと高く、その影響が出ていると考えています。
  kind: block
  block: sg_insulation
- id: 17
  speaker: 山田 隆
  text: それなら乾燥させてから再測定してもらえますか。それまではこの項目は継続協議にしておきましょう。
  kind: block
  block: sg_insulation
- id: 18
  speaker: 田中 誠
  text: 承知しました。除湿してから再測定します。
  kind: block
  block: sg_insulation
- id: 19
  speaker: 鈴木 舞
  text: 耐電圧試験を行います。交流2000ボルトを1分間印加します。
  kind: block
  block: sg_withstand
- id: 20
  speaker: 鈴木 舞
  text: 1分間経過しました。絶縁破壊やフラッシュオーバーなどの異常はありませんでした。
  kind: block
  block: sg_withstand
- id: 21
  speaker: 佐藤 健二
  text: 漏れ電流の値はどうでしたか。
  kind: block
  block: sg_withstand
- id: 22
  speaker: 鈴木 舞
  text: 漏れ電流は3.5ミリアンペアで、安定していました。
  kind: block
  block: sg_withstand
- id: 23
  speaker: 佐藤 健二
  text: 問題ないですね。耐電圧試験は合格とします。
  kind: block
  block: sg_withstand
- id: 24
  speaker: 田中 誠
  text: シーケンス動作試験です。遮断器の投入指令から表示灯の点灯まで0.8秒でした。
  kind: block
  block: sg_sequence
- id: 25
  speaker: 山田 隆
  text: 当社の運用では0.5秒以内が望ましいと考えているんですが。
  kind: block
  block: sg_sequence
- id: 26
  speaker: 田中 誠
  text: 仕様書には時間の規定がありませんが、補助リレーの設定変更で短くすることは可能です。
  kind: block
  block: sg_sequence
- id: 27
  speaker: 山田 隆
  text: 要求値が仕様書に入っているか、社内で確認させてください。この件は保留でお願いします。
  kind: block
  block: sg_sequence
- id: 28
  speaker: 田中 誠
  text: 承知しました。ご確認の結果をお待ちします。
  kind: block
  block: sg_sequence
- id: 29
  speaker: 田中 誠
  text: 先ほど継続協議になっていた絶縁抵抗の件ですが、除湿後に再測定したところ、45メガオームでした。
  kind: resolve
  block: sg_insulation
- id: 30
  speaker: 山田 隆
  text: 45メガオームなら十分ですね。絶縁抵抗は合格で合意とします。
  kind: resolve
  block: sg_insulation
- id: 31
  speaker: 田中 誠
  text: インターロックの確認です。遮断器が投入状態のときに、断路器を操作できないことを確認します。
  kind: block
  block: sg_interlock
- id: 32
  speaker: 田中 誠
  text: ご覧のとおり、断路器のハンドルはロックされて動きません。
  kind: block
  block: sg_interlock
- id: 33
  speaker: 山田 隆
  text: 逆の条件、断路器が中間位置のときに遮断器が投入できないことも見せてください。
  kind: block
  block: sg_interlock
- id: 34
  speaker: 田中 誠
  text: はい。中間位置では投入指令を出しても遮断器は動作しません。
  kind: block
  block: sg_interlock
- id: 35
  speaker: 山田 隆
  text: 確認しました。インターロックは問題ありません。
  kind: block
  block: sg_interlock
- id: 36
  speaker: 山田 隆
  text: 銘板を見ると定格電流が1200アンペアになっていますが、仕様は1250アンペアですよね。
  kind: block
  block: sg_nameplate
- id: 37
  speaker: 田中 誠
  text: 申し訳ありません、銘板の誤記です。1250アンペアで作り直します。
  kind: block
  block: sg_nameplate
- id: 38
  speaker: 山田 隆
  text: 出荷までに間に合いますか。
  kind: block
  block: sg_nameplate
- id: 39
  speaker: 田中 誠
  text: 10月16日までに再発行して取り付けます。取り付け後の写真もお送りします。
  kind: block
  block: sg_nameplate
- id: 40
  speaker: 山田 隆
  text: それでお願いします。
  kind: block
  block: sg_nameplate
- id: 41
  speaker: 佐藤 健二
  text: 表示灯について一つ要望があります。軽故障の表示灯を赤から黄色に変えてもらえませんか。
  kind: block
  block: sg_lamp
- id: 42
  speaker: 佐藤 健二
  text: 既設の盤と色を合わせたいんです。
  kind: block
  block: sg_lamp
- id: 43
  speaker: 鈴木 舞
  text: レンズの交換だけで対応できますので、追加費用なしで変更いたします。
  kind: block
  block: sg_lamp
- id: 44
  speaker: 鈴木 舞
  text: 10月23日までに交換を済ませます。
  kind: block
  block: sg_lamp
- id: 45
  speaker: 佐藤 健二
  text: 助かります。よろしくお願いします。
  kind: block
  block: sg_lamp
- id: 46
  speaker: 佐藤 健二
  text: 完成図書ですが、海外の関連会社でも使うので英語版もいただけますか。
  kind: block
  block: sg_docs
- id: 47
  speaker: 田中 誠
  text: 英語版は契約範囲外になりますので、翻訳費用が別途かかります。
  kind: block
  block: sg_docs
- id: 48
  speaker: 佐藤 健二
  text: 費用次第ですね。まず見積もりをいただけますか。
  kind: block
  block: sg_docs
- id: 49
  speaker: 田中 誠
  text: 10月14日までにお見積もりを提出します。
  kind: block
  block: sg_docs
- id: 50
  speaker: 佐藤 健二
  text: それを見てから決めます。この件は継続協議でお願いします。
  kind: block
  block: sg_docs
- id: 51
  speaker: 鈴木 舞
  text: 保護継電器の動作試験です。過電流継電器の整定は5アンペア、動作時間0.3秒です。
  kind: block
  block: sg_relay
- id: 52
  speaker: 鈴木 舞
  text: 試験電流を流したところ、動作時間は0.31秒でした。許容差はプラスマイナス5パーセントなので範囲内です。
  kind: block
  block: sg_relay
- id: 53
  speaker: 山田 隆
  text: 3回測定した値ですか。
  kind: block
  block: sg_relay
- id: 54
  speaker: 鈴木 舞
  text: はい、3回の平均です。ばらつきは0.01秒以内でした。
  kind: block
  block: sg_relay
- id: 55
  speaker: 山田 隆
  text: 分かりました。継電器の動作試験は合格です。
  kind: block
  block: sg_relay
- id: 56
  speaker: 田中 誠
  text: 本日予定していた項目は以上です。残った課題は議事録にまとめて送付いたします。
  kind: closing
  block: null
- id: 57
  speaker: 佐藤 健二
  text: ありがとうございました。お疲れさまでした。
  kind: closing
  block: null
