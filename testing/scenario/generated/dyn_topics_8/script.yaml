meta:
  trial_name: 閉鎖配電盤(型式 SWB-3300) 出荷前立会試験
  location: 第2工場 電気試験室
  date: 2026年10月1日
  client_attendees:
  - 山田 隆
  - 佐藤 健二
  our_attendees:
  - 田中 誠
  - 鈴木 舞
  bt_wearers:
  - 田中 誠
  bt_wearer: 田中 誠
speakers:
  山田 隆: client
  佐藤 健二: client
  田中 誠: our_side
  鈴木 舞: our_side
turns:
- id: 1
  speaker: 鈴木 舞
  text: それでは時間になりましたので、閉鎖配電盤(型式 SWB-3300) 出荷前立会試験を始めさせていただきます。本日はよろしくお願いいたします。
  kind: opening
  block: null
- id: 2
  speaker: 山田 隆
  text: よろしくお願いします。
  kind: opening
  block: null
- id: 3
  speaker: 鈴木 舞
  text: 本日の試験項目は、お配りした試験要領書のとおりです。順番に進めてまいります。
  kind: opening
  block: null
- id: 4
  speaker: 山田 隆
  text: まず外観ですが、右側面の下のあたりに塗装のムラがありますね。光の当たり方で目立ちます。
  kind: block
  block: sg_appearance
- id: 5
  speaker: 田中 誠
  text: ご指摘ありがとうございます。確かにムラがありますので、右側面は出荷前に再塗装いたします。
  kind: block
  block: sg_appearance
- id: 6
  speaker: 山田 隆
  text: お願いします。いつ頃になりますか。
  kind: block
  block: sg_appearance
- id: 7
  speaker: 田中 誠
  text: 10月9日までに再塗装を完了させて、写真でご報告します。
  kind: block
  block: sg_appearance
- id: 8
  speaker: 山田 隆
  text: 分かりました。それで結構です。
  kind: block
  block: sg_appearance
- id: 9
  speaker: 田中 誠
  text: 続いて寸法の確認です。盤の幅は図面で800ミリ、公差はプラスマイナス2ミリです。
  kind: block
  block: sg_dimension
- id: 10
  speaker: 田中 誠
  text: 実測は801.5ミリでした。公差の範囲に入っています。
  kind: block
  block: sg_dimension
- id: 11
  speaker: 佐藤 健二
  text: 奥行きと高さも図面どおりでしたか。
  kind: block
  block: sg_dimension
- id: 12
  speaker: 田中 誠
  text: はい、奥行き、高さとも図面どおりです。記録表にも記入しています。
  kind: block
  block: sg_dimension
- id: 13
  speaker: 佐藤 健二
  text: 了解です。寸法は問題ありません。
  kind: block
  block: sg_dimension
- id: 14
  speaker: 田中 誠
  text: 次に絶縁抵抗試験の結果です。主回路と大地間で3.2メガオームでした。
  kind: block
  block: sg_insulation
- id: 15
  speaker: 山田 隆
  text: 判定基準の下限は2メガオームですよね。合格ではありますが、余裕が少なくないですか。
  kind: block
  block: sg_insulation
- id: 16
  speaker: 田中 誠
  text: 本日は湿度が68パーセントと高く、その影響が出ていると考えています。
  kind: block
  block: sg_insulation
- id: 17
  speaker: 山田 隆
  text: それなら乾燥させてから再測定してもらえますか。それまではこの項目は継続協議にしておきましょう。
  kind: block
  block: sg_insulation
- id: 18
  speaker: 田中 誠
  text: 承知しました。除湿してから再測定します。
  kind: block
  block: sg_insulation
- id: 19
  speaker: 鈴木 舞
  text: 耐電圧試験を行います。交流2000ボルトを1分間印加します。
  kind: block
  block: sg_withstand
- id: 20
  speaker: 鈴木 舞
  text: 1分間経過しました。絶縁破壊やフラッシュオーバーなどの異常はありませんでした。
  kind: block
  block: sg_withstand
- id: 21
  speaker: 佐藤 健二
  text: 漏れ電流の値はどうでしたか。
  kind: block
  block: sg_withstand
- id: 22
  speaker: 鈴木 舞
  text: 漏れ電流は3.5ミリアンペアで、安定していました。
  kind: block
  block: sg_withstand
- id: 23
  speaker: 佐藤 健二
  text: 問題ないですね。耐電圧試験は合格とします。
  kind: block
  block: sg_withstand
- id: 24
  speaker: 田中 誠
  text: インターロックの確認です。遮断器が投入状態のときに、断路器を操作できないことを確認します。
  kind: block
  block: sg_interlock
- id: 25
  speaker: 田中 誠
  text: ご覧のとおり、断路器のハンドルはロックされて動きません。
  kind: block
  block: sg_interlock
- id: 26
  speaker: 山田 隆
  text: 逆の条件、断路器が中間位置のときに遮断器が投入できないことも見せてください。
  kind: block
  block: sg_interlock
- id: 27
  speaker: 田中 誠
  text: はい。中間位置では投入指令を出しても遮断器は動作しません。
  kind: block
  block: sg_interlock
- id: 28
  speaker: 山田 隆
  text: 確認しました。インターロックは問題ありません。
  kind: block
  block: sg_interlock
- id: 29
  speaker: 山田 隆
  text: 銘板を見ると定格電流が1200アンペアになっていますが、仕様は1250アンペアですよね。
  kind: block
  block: sg_nameplate
- id: 30
  speaker: 田中 誠
  text: 申し訳ありません、銘板の誤記です。1250アンペアで作り直します。
  kind: block
  block: sg_nameplate
- id: 31
  speaker: 山田 隆
  text: 出荷までに間に合いますか。
  kind: block
  block: sg_nameplate
- id: 32
  speaker: 田中 誠
  text: 10月16日までに再発行して取り付けます。取り付け後の写真もお送りします。
  kind: block
  block: sg_nameplate
- id: 33
  speaker: 山田 隆
  text: それでお願いします。
  kind: block
  block: sg_nameplate
- id: 34
  speaker: 田中 誠
  text: 先ほど継続協議になっていた絶縁抵抗の件ですが、除湿後に再測定したところ、45メガオームでした。
  kind: resolve
  block: sg_insulation
- id: 35
  speaker: 山田 隆
  text: 45メガオームなら十分ですね。絶縁抵抗は合格で合意とします。
  kind: resolve
  block: sg_insulation
- id: 36
  speaker: 佐藤 健二
  text: 完成図書ですが、海外の関連会社でも使うので英語版もいただけますか。
  kind: block
  block: sg_docs
- id: 37
  speaker: 鈴木 舞
  text: 英語版は契約範囲外になりますので、翻訳費用が別途かかります。
  kind: block
  block: sg_docs
- id: 38
  speaker: 佐藤 健二
  text: 費用次第ですね。まず見積もりをいただけますか。
  kind: block
  block: sg_docs
- id: 39
  speaker: 鈴木 舞
  text: 10月14日までにお見積もりを提出します。
  kind: block
  block: sg_docs
- id: 40
  speaker: 佐藤 健二
  text: それを見てから決めます。この件は継続協議でお願いします。
  kind: block
  block: sg_docs
- id: 41
  speaker: 田中 誠
  text: 保護継電器の動作試験です。過電流継電器の整定は5アンペア、動作時間0.3秒です。
  kind: block
  block: sg_relay
- id: 42
  speaker: 田中 誠
  text: 試験電流を流したところ、動作時間は0.31秒でした。許容差はプラスマイナス5パーセントなので範囲内です。
  kind: block
  block: sg_relay
- id: 43
  speaker: 山田 隆
  text: 3回測定した値ですか。
  kind: block
  block: sg_relay
- id: 44
  speaker: 田中 誠
  text: はい、3回の平均です。ばらつきは0.01秒以内でした。
  kind: block
  block: sg_relay
- id: 45
  speaker: 山田 隆
  text: 分かりました。継電器の動作試験は合格です。
  kind: block
  block: sg_relay
- id: 46
  speaker: 田中 誠
  text: 変圧比試験の結果です。一次66キロボルト、二次6.6キロボルトで、全タップの比誤差は最大0.2パーセントでした。
  kind: block
  block: tr_ratio
- id: 47
  speaker: 佐藤 健二
  text: 規格の許容差はプラスマイナス0.5パーセントでしたね。
  kind: block
  block: tr_ratio
- id: 48
  speaker: 田中 誠
  text: はい、すべてのタップで許容差内です。極性と角変位も確認済みです。
  kind: block
  block: tr_ratio
- id: 49
  speaker: 佐藤 健二
  text: 了解しました。変圧比試験は合格とします。
  kind: block
  block: tr_ratio
- id: 50
  speaker: 田中 誠
  text: 無負荷損の測定値は8.4キロワットでした。
  kind: block
  block: tr_noload
- id: 51
  speaker: 佐藤 健二
  text: 保証値は8.0キロワットですよね。5パーセント超えています。
  kind: block
  block: tr_noload
- id: 52
  speaker: 田中 誠
  text: JECの規格では無負荷損の許容差はプラス15パーセントですので、規格上は合格です。
  kind: block
  block: tr_noload
- id: 53
  speaker: 佐藤 健二
  text: ただ、契約上は保証値で評価することになっているはずです。契約書を確認するまで継続協議にさせてください。
  kind: block
  block: tr_noload
- id: 54
  speaker: 田中 誠
  text: 承知しました。こちらでも契約の条項を確認します。
  kind: block
  block: tr_noload
- id: 55
  speaker: 鈴木 舞
  text: 負荷損と短絡インピーダンスの測定です。インピーダンスは7.4パーセントで、仕様の7.5パーセントに対して許容差内です。
  kind: block
  block: tr_impedance
- id: 56
  speaker: 佐藤 健二
  text: 負荷損の方は保証値以内ですか。
  kind: block
  block: tr_impedance
- id: 57
  speaker: 鈴木 舞
  text: はい、保証値62キロワットに対して59.8キロワットでした。
  kind: block
  block: tr_impedance
- id: 58
  speaker: 佐藤 健二
  text: 問題ないですね。合格です。
  kind: block
  block: tr_impedance
- id: 59
  speaker: 鈴木 舞
  text: 温度上昇試験の結果です。油の温度上昇は52ケルビン、巻線は63ケルビンでした。限度はそれぞれ55と65ケルビンです。
  kind: block
  block: tr_temp
- id: 60
  speaker: 佐藤 健二
  text: 巻線の余裕が2ケルビンしかないですね。夏場の運転が心配です。
  kind: block
  block: tr_temp
- id: 61
  speaker: 鈴木 舞
  text: 設置場所の周囲温度の条件は仕様に織り込み済みですので、夏季でも限度は超えない設計です。
  kind: block
  block: tr_temp
- id: 62
  speaker: 佐藤 健二
  text: 運転部門の意見も聞きたいので、この項目は判断を保留させてください。
  kind: block
  block: tr_temp
- id: 63
  speaker: 鈴木 舞
  text: 承知しました。計算書を追加でお送りします。
  kind: block
  block: tr_temp
- id: 64
  speaker: 佐藤 健二
  text: 先ほどの無負荷損の件、本社に確認したところ、契約書に規格の許容差を適用すると書いてありました。
  kind: resolve
  block: tr_noload
- id: 65
  speaker: 佐藤 健二
  text: なので8.4キロワットで問題ありません。無負荷損は合意とします。
  kind: resolve
  block: tr_noload
- id: 66
  speaker: 田中 誠
  text: ありがとうございます。記録にもそのように残します。
  kind: resolve
  block: tr_noload
- id: 67
  speaker: 佐藤 健二
  text: 放熱器の下側のフランジから、少し油がにじんでいませんか。
  kind: block
  block: tr_oil_leak
- id: 68
  speaker: 鈴木 舞
  text: 確認しました。パッキンの締め付け不足のようです。
  kind: block
  block: tr_oil_leak
- id: 69
  speaker: 鈴木 舞
  text: パッキンを交換したうえで、10月12日までに油漏れ試験をやり直します。
  kind: block
  block: tr_oil_leak
- id: 70
  speaker: 佐藤 健二
  text: やり直しの結果は書面でください。それで了承します。
  kind: block
  block: tr_oil_leak
- id: 71
  speaker: 鈴木 舞
  text: 騒音測定の結果は、変圧器から0.3メートルの位置の平均で68デシベルでした。
  kind: block
  block: tr_noise
- id: 72
  speaker: 山田 隆
  text: 仕様は70デシベル以下ですから問題ないですね。暗騒音はどのくらいでしたか。
  kind: block
  block: tr_noise
- id: 73
  speaker: 鈴木 舞
  text: 暗騒音は45デシベルで、補正は不要でした。
  kind: block
  block: tr_noise
- id: 74
  speaker: 山田 隆
  text: 分かりました。騒音は合格です。
  kind: block
  block: tr_noise
- id: 75
  speaker: 佐藤 健二
  text: 負荷時タップ切換器の動作回数カウンターですが、数字が一桁欠けて表示されていますね。
  kind: block
  block: tr_tap_counter
- id: 76
  speaker: 田中 誠
  text: 表示部の不良です。カウンターを新品に交換します。
  kind: block
  block: tr_tap_counter
- id: 77
  speaker: 佐藤 健二
  text: 交換はいつになりますか。
  kind: block
  block: tr_tap_counter
- id: 78
  speaker: 田中 誠
  text: 部品の入手に時間がかかるので、10月20日までに交換します。
  kind: block
  block: tr_tap_counter
- id: 79
  speaker: 佐藤 健二
  text: 了解です。
  kind: block
  block: tr_tap_counter
- id: 80
  speaker: 山田 隆
  text: 温度上昇試験の前後で、絶縁油の油中ガス分析はやっていますか。
  kind: block
  block: tr_dga
- id: 81
  speaker: 田中 誠
  text: はい、サンプルは採取済みです。外部の分析機関に出していますので、結果はまだです。
  kind: block
  block: tr_dga
- id: 82
  speaker: 田中 誠
  text: 10月21日までに分析結果をお送りします。
  kind: block
  block: tr_dga
- id: 83
  speaker: 山田 隆
  text: では結果を見るまで、この項目は保留にしておきます。
  kind: block
  block: tr_dga
- id: 84
  speaker: 田中 誠
  text: 振動測定の結果です。軸受部の振動速度は最大で1.8ミリメートル毎秒でした。
  kind: block
  block: mt_vibration
- id: 85
  speaker: 山田 隆
  text: 判定値はいくつでしたか。
  kind: block
  block: mt_vibration
- id: 86
  speaker: 田中 誠
  text: 2.8ミリメートル毎秒以下です。負荷側、反負荷側とも判定値以内です。
  kind: block
  block: mt_vibration
- id: 87
  speaker: 山田 隆
  text: 問題ありませんね。振動は合格です。
  kind: block
  block: mt_vibration
- id: 88
  speaker: 田中 誠
  text: 無負荷での騒音は82デシベルでした。
  kind: block
  block: mt_noise
- id: 89
  speaker: 佐藤 健二
  text: 仕様では80デシベル以下ですよね。2デシベル超えています。
  kind: block
  block: mt_noise
- id: 90
  speaker: 田中 誠
  text: 冷却ファンの風切り音が主な原因です。防音カバーを追加すれば仕様内に収まる見込みです。
  kind: block
  block: mt_noise
- id: 91
  speaker: 佐藤 健二
  text: カバーを付けると保守がやりにくくなりますし、費用の負担も決めないといけません。継続協議にしましょう。
  kind: block
  block: mt_noise
- id: 92
  speaker: 田中 誠
  text: 承知しました。カバーの構造案と費用を整理してご提案します。
  kind: block
  block: mt_noise
- id: 93
  speaker: 鈴木 舞
  text: 損失の測定から算出した効率は96.2パーセントでした。保証値は96.0パーセントです。
  kind: block
  block: mt_efficiency
- id: 94
  speaker: 山田 隆
  text: IE3相当という条件も満たしていますか。
  kind: block
  block: mt_efficiency
- id: 95
  speaker: 鈴木 舞
  text: はい、IE3の効率値を上回っています。
  kind: block
  block: mt_efficiency
- id: 96
  speaker: 山田 隆
  text: 了解しました。効率は合格です。
  kind: block
  block: mt_efficiency
- id: 97
  speaker: 鈴木 舞
  text: 温度上昇試験です。固定子巻線の温度上昇は抵抗法で75ケルビンでした。
  kind: block
  block: mt_winding_temp
- id: 98
  speaker: 鈴木 舞
  text: F種絶縁をB種の温度上昇で使う条件ですので、限度は80ケルビンです。
  kind: block
  block: mt_winding_temp
- id: 99
  speaker: 山田 隆
  text: 5ケルビンの余裕ですね。了解しました。合格とします。
  kind: block
  block: mt_winding_temp
- id: 100
  speaker: 佐藤 健二
  text: 反負荷側の軸受温度が、負荷側より8度ほど高いのが気になります。
  kind: block
  block: mt_bearing
- id: 101
  speaker: 田中 誠
  text: グリースの封入量が多めだった可能性があります。量を確認して、明日もう一度運転してみます。
  kind: block
  block: mt_bearing
- id: 102
  speaker: 佐藤 健二
  text: では明日の再試験の結果を見るまで、この件は保留にします。
  kind: block
  block: mt_bearing
- id: 103
  speaker: 佐藤 健二
  text: 現地のケーブルの取り回しを考えると、端子箱を右側から左側に変更してほしいのですが。
  kind: block
  block: mt_terminal_box
- id: 104
  speaker: 田中 誠
  text: 設計変更は可能ですが、フレームの加工が必要になり、納期が2週間ほど延びます。
  kind: block
  block: mt_terminal_box
- id: 105
  speaker: 佐藤 健二
  text: 納期が延びるのは困りますね。工事の工程と調整してみますので、継続協議にさせてください。
  kind: block
  block: mt_terminal_box
- id: 106
  speaker: 田中 誠
  text: 先ほどの騒音の件ですが、防音カバーは当社負担で、点検口付きの構造にするということでいかがでしょうか。
  kind: resolve
  block: mt_noise
- id: 107
  speaker: 山田 隆
  text: 点検口があるなら保守も問題ないですね。騒音の件はそれで合意とします。
  kind: resolve
  block: mt_noise
- id: 108
  speaker: 田中 誠
  text: 巻線の絶縁抵抗と成極指数です。成極指数は3.1で、判定基準の2.0以上です。
  kind: block
  block: mt_insulation
- id: 109
  speaker: 山田 隆
  text: 良好ですね。耐電圧試験も異常なしでしたか。
  kind: block
  block: mt_insulation
- id: 110
  speaker: 田中 誠
  text: はい、耐電圧も異常ありませんでした。
  kind: block
  block: mt_insulation
- id: 111
  speaker: 山田 隆
  text: 了解です。
  kind: block
  block: mt_insulation
- id: 112
  speaker: 山田 隆
  text: 予備品として、軸受を1セット追加で購入したいと考えています。
  kind: block
  block: mt_spare
- id: 113
  speaker: 田中 誠
  text: 承知しました。10月16日までにお見積もりをお出しします。
  kind: block
  block: mt_spare
- id: 114
  speaker: 山田 隆
  text: 見積もりを見てから発注するか決めます。継続協議でお願いします。
  kind: block
  block: mt_spare
- id: 115
  speaker: 鈴木 舞
  text: 入出力チェックの結果です。入力256点、出力128点をすべて確認しました。
  kind: block
  block: plc_io
- id: 116
  speaker: 鈴木 舞
  text: そのうち入力の37番と38番の配線が入れ替わっていたので、修正して再確認済みです。
  kind: block
  block: plc_io
- id: 117
  speaker: 佐藤 健二
  text: 修正後の確認は、私たちが立ち会った状態でもう一度見せてもらえますか。
  kind: block
  block: plc_io
- id: 118
  speaker: 鈴木 舞
  text: はい、今から37番と38番を順に入れますので、画面をご覧ください。
  kind: block
  block: plc_io
- id: 119
  speaker: 佐藤 健二
  text: 確認できました。入出力チェックは合格です。
  kind: block
  block: plc_io
- id: 120
  speaker: 佐藤 健二
  text: 警報一覧の画面ですが、重故障は赤の点滅にしてもらえますか。今は軽故障と同じ表示で区別がつきにくいです。
  kind: block
  block: plc_alarm
- id: 121
  speaker: 鈴木 舞
  text: 画面の設定変更で対応できます。10月8日までに修正版をお送りします。
  kind: block
  block: plc_alarm
- id: 122
  speaker: 佐藤 健二
  text: ありがとうございます。それでお願いします。
  kind: block
  block: plc_alarm
- id: 123
  speaker: 佐藤 健二
  text: トレンドデータの保存期間が30日になっていますが、水質の管理上、1年は残したいんです。
  kind: block
  block: plc_trend
- id: 124
  speaker: 鈴木 舞
  text: 1年分を保存するにはストレージの増設が必要になります。
  kind: block
  block: plc_trend
- id: 125
  speaker: 佐藤 健二
  text: 増設の費用と、外部に書き出す方法があるかも含めて検討したいので、継続協議でお願いします。
  kind: block
  block: plc_trend
- id: 126
  speaker: 鈴木 舞
  text: 承知しました。両方の案を比較してお示しします。
  kind: block
  block: plc_trend
- id: 127
  speaker: 田中 誠
  text: 取水ポンプのインターロックです。水位低の信号を入れると、運転中のポンプが停止することを確認します。
  kind: block
  block: plc_pump_interlock
- id: 128
  speaker: 田中 誠
  text: 信号を入れました。ポンプが停止し、画面にも水位低の警報が出ています。
  kind: block
  block: plc_pump_interlock
- id: 129
  speaker: 山田 隆
  text: 復帰の手順も確認させてください。
  kind: block
  block: plc_pump_interlock
- id: 130
  speaker: 田中 誠
  text: 水位が戻った後、画面から復帰操作をしないと再起動しない仕様です。
  kind: block
  block: plc_pump_interlock
- id: 131
  speaker: 山田 隆
  text: 確認しました。問題ありません。
  kind: block
  block: plc_pump_interlock
- id: 132
  speaker: 佐藤 健二
  text: 上位の監視システムとの通信で、さっき一度タイムアウトが出ていましたね。
  kind: block
  block: plc_modbus
- id: 133
  speaker: 田中 誠
  text: はい、1回だけ発生しました。原因はまだ分かっていません。
  kind: block
  block: plc_modbus
- id: 134
  speaker: 田中 誠
  text: 10月15日までに原因を調査して報告します。
  kind: block
  block: plc_modbus
- id: 135
  speaker: 佐藤 健二
  text: 原因が分かるまで継続協議にします。
  kind: block
  block: plc_modbus
- id: 136
  speaker: 佐藤 健二
  text: 操作権限がオペレーターと管理者の2段階ですが、保守員を加えて3段階にしたいです。
  kind: block
  block: plc_user_level
- id: 137
  speaker: 田中 誠
  text: 対応できます。保守員の権限でできる操作の一覧をいただけますか。
  kind: block
  block: plc_user_level
- id: 138
  speaker: 佐藤 健二
  text: 一覧は今週中に送ります。
  kind: block
  block: plc_user_level
- id: 139
  speaker: 田中 誠
  text: ありがとうございます。一覧をいただいてから、10月22日までに画面を改修します。
  kind: block
  block: plc_user_level
- id: 140
  speaker: 佐藤 健二
  text: それでお願いします。
  kind: block
  block: plc_user_level
- id: 141
  speaker: 田中 誠
  text: トレンドの保存期間の件、外付けのストレージで1年分を保存する案なら、追加費用は小さく済みます。
  kind: resolve
  block: plc_trend
- id: 142
  speaker: 佐藤 健二
  text: それなら外付けストレージの案で進めてください。トレンドの件は合意とします。
  kind: resolve
  block: plc_trend
- id: 143
  speaker: 佐藤 健二
  text: 監視画面の時計が、上位システムと3秒ずれていますね。
  kind: block
  block: plc_time_sync
- id: 144
  speaker: 田中 誠
  text: 時刻同期の設定で、サーバーのアドレスが間違っていました。今修正しました。
  kind: block
  block: plc_time_sync
- id: 145
  speaker: 佐藤 健二
  text: 今は一致していますね。了解しました。
  kind: block
  block: plc_time_sync
- id: 146
  speaker: 山田 隆
  text: 取扱説明書ですが、画面操作の説明が全体的に不足していると思います。
  kind: block
  block: plc_manual
- id: 147
  speaker: 鈴木 舞
  text: 具体的にどの画面の説明を追記すればよいか、ご指示いただけますか。
  kind: block
  block: plc_manual
- id: 148
  speaker: 山田 隆
  text: 社内で運転員に聞いて一覧にします。それまでこの件は保留にしてください。
  kind: block
  block: plc_manual
- id: 149
  speaker: 田中 誠
  text: 本日予定していた項目は以上です。残った課題は議事録にまとめて送付いたします。
  kind: closing
  block: null
- id: 150
  speaker: 山田 隆
  text: ありがとうございました。お疲れさまでした。
  kind: closing
  block: null
