meta:
  trial_name: 高圧三相誘導電動機(型式 MX-750 750kW) 工場立会試験
  location: 回転機工場 第3試験台
  date: 2026年10月1日
  client_attendees:
  - 山田 隆
  - 佐藤 健二
  our_attendees:
  - 田中 誠
  - 鈴木 舞
  bt_wearers:
  - 田中 誠
  bt_wearer: 田中 誠
speakers:
  山田 隆: client
  佐藤 健二: client
  田中 誠: our_side
  鈴木 舞: our_side
turns:
- id: 1
  speaker: 鈴木 舞
  text: それでは時間になりましたので、高圧三相誘導電動機(型式 MX-750 750kW) 工場立会試験を始めさせていただきます。本日はよろしくお願いいたします。
  kind: opening
  block: null
- id: 2
  speaker: 佐藤 健二
  text: よろしくお願いします。
  kind: opening
  block: null
- id: 3
  speaker: 鈴木 舞
  text: 本日の試験項目は、お配りした試験要領書のとおりです。順番に進めてまいります。
  kind: opening
  block: null
- id: 4
  speaker: 田中 誠
  text: 振動測定の結果です。軸受部の振動速度は最大で1.8ミリメートル毎秒でした。
  kind: block
  block: mt_vibration
- id: 5
  speaker: 佐藤 健二
  text: 判定値はいくつでしたか。
  kind: block
  block: mt_vibration
- id: 6
  speaker: 田中 誠
  text: 2.8ミリメートル毎秒以下です。負荷側、反負荷側とも判定値以内です。
  kind: block
  block: mt_vibration
- id: 7
  speaker: 佐藤 健二
  text: 問題ありませんね。振動は合格です。
  kind: block
  block: mt_vibration
- id: 8
  speaker: 佐藤 健二
  text: この試験室、十年前に別の案件で来たことがあるんですよ。
  kind: chitchat
  block: cc_old_project
- id: 9
  speaker: 田中 誠
  text: そうでしたか。その後で床と照明を改修しているので、雰囲気が変わったと思います。
  kind: chitchat
  block: cc_old_project
- id: 10
  speaker: 鈴木 舞
  text: 無負荷での騒音は82デシベルでした。
  kind: block
  block: mt_noise
- id: 11
  speaker: 山田 隆
  text: 仕様では80デシベル以下ですよね。2デシベル超えています。
  kind: block
  block: mt_noise
- id: 12
  speaker: 鈴木 舞
  text: 冷却ファンの風切り音が主な原因です。防音カバーを追加すれば仕様内に収まる見込みです。
  kind: block
  block: mt_noise
- id: 13
  speaker: 山田 隆
  text: カバーを付けると保守がやりにくくなりますし、費用の負担も決めないといけません。継続協議にしましょう。
  kind: block
  block: mt_noise
- id: 14
  speaker: 鈴木 舞
  text: 承知しました。カバーの構造案と費用を整理してご提案します。
  kind: block
  block: mt_noise
- id: 15
  speaker: 田中 誠
  text: お昼は食堂を用意していますので、休憩のときにご案内します。
  kind: chitchat
  block: cc_lunch
- id: 16
  speaker: 山田 隆
  text: ありがとうございます。ここの食堂はカレーが有名だと聞きました。
  kind: chitchat
  block: cc_lunch
- id: 17
  speaker: 田中 誠
  text: そうなんです、金曜日だけ出るんですよ。
  kind: chitchat
  block: cc_lunch
- id: 18
  speaker: 鈴木 舞
  text: 損失の測定から算出した効率は96.2パーセントでした。保証値は96.0パーセントです。
  kind: block
  block: mt_efficiency
- id: 19
  speaker: 山田 隆
  text: IE3相当という条件も満たしていますか。
  kind: block
  block: mt_efficiency
- id: 20
  speaker: 鈴木 舞
  text: はい、IE3の効率値を上回っています。
  kind: block
  block: mt_efficiency
- id: 21
  speaker: 山田 隆
  text: 了解しました。効率は合格です。
  kind: block
  block: mt_efficiency
- id: 22
  speaker: 鈴木 舞
  text: 温度上昇試験です。固定子巻線の温度上昇は抵抗法で75ケルビンでした。
  kind: block
  block: mt_winding_temp
- id: 23
  speaker: 鈴木 舞
  text: F種絶縁をB種の温度上昇で使う条件ですので、限度は80ケルビンです。
  kind: block
  block: mt_winding_temp
- id: 24
  speaker: 佐藤 健二
  text: 5ケルビンの余裕ですね。了解しました。合格とします。
  kind: block
  block: mt_winding_temp
- id: 25
  speaker: 鈴木 舞
  text: 先ほどの騒音の件ですが、防音カバーは当社負担で、点検口付きの構造にするということでいかがでしょうか。
  kind: resolve
  block: mt_noise
- id: 26
  speaker: 山田 隆
  text: 点検口があるなら保守も問題ないですね。騒音の件はそれで合意とします。
  kind: resolve
  block: mt_noise
- id: 27
  speaker: 佐藤 健二
  text: 反負荷側の軸受温度が、負荷側より8度ほど高いのが気になります。
  kind: block
  block: mt_bearing
- id: 28
  speaker: 鈴木 舞
  text: グリースの封入量が多めだった可能性があります。量を確認して、明日もう一度運転してみます。
  kind: block
  block: mt_bearing
- id: 29
  speaker: 佐藤 健二
  text: では明日の再試験の結果を見るまで、この件は保留にします。
  kind: block
  block: mt_bearing
- id: 30
  speaker: 佐藤 健二
  text: そういえば、週末に台風が来るみたいですね。
  kind: chitchat
  block: cc_weather
- id: 31
  speaker: 田中 誠
  text: そうなんですよ。帰りの新幹線が止まらないといいんですが。
  kind: chitchat
  block: cc_weather
- id: 32
  speaker: 佐藤 健二
  text: 早めに帰った方がいいかもしれませんね。
  kind: chitchat
  block: cc_weather
- id: 33
  speaker: 鈴木 舞
  text: 拘束試験から求めた始動電流は、定格電流の6.2倍でした。仕様は6.5倍以下です。
  kind: block
  block: mt_starting
- id: 34
  speaker: 佐藤 健二
  text: 始動トルクも仕様を満たしていますか。
  kind: block
  block: mt_starting
- id: 35
  speaker: 鈴木 舞
  text: はい、始動トルクは定格の85パーセントで、仕様の80パーセント以上を満たしています。
  kind: block
  block: mt_starting
- id: 36
  speaker: 佐藤 健二
  text: 分かりました。合格です。
  kind: block
  block: mt_starting
- id: 37
  speaker: 田中 誠
  text: 飲み物は試験室の外の自販機をご自由にお使いください。
  kind: chitchat
  block: cc_coffee
- id: 38
  speaker: 佐藤 健二
  text: ありがとうございます。あとでコーヒーでもいただきます。
  kind: chitchat
  block: cc_coffee
- id: 39
  speaker: 佐藤 健二
  text: 現地のケーブルの取り回しを考えると、端子箱を右側から左側に変更してほしいのですが。
  kind: block
  block: mt_terminal_box
- id: 40
  speaker: 田中 誠
  text: 設計変更は可能ですが、フレームの加工が必要になり、納期が2週間ほど延びます。
  kind: block
  block: mt_terminal_box
- id: 41
  speaker: 佐藤 健二
  text: 納期が延びるのは困りますね。工事の工程と調整してみますので、継続協議にさせてください。
  kind: block
  block: mt_terminal_box
- id: 42
  speaker: 佐藤 健二
  text: 今朝は高速の渋滞がひどくて、ぎりぎりになってしまいました。
  kind: chitchat
  block: cc_traffic
- id: 43
  speaker: 田中 誠
  text: 事故があったみたいですね。無事に着かれてよかったです。
  kind: chitchat
  block: cc_traffic
- id: 44
  speaker: 鈴木 舞
  text: 巻線の絶縁抵抗と成極指数です。成極指数は3.1で、判定基準の2.0以上です。
  kind: block
  block: mt_insulation
- id: 45
  speaker: 山田 隆
  text: 良好ですね。耐電圧試験も異常なしでしたか。
  kind: block
  block: mt_insulation
- id: 46
  speaker: 鈴木 舞
  text: はい、耐電圧も異常ありませんでした。
  kind: block
  block: mt_insulation
- id: 47
  speaker: 山田 隆
  text: 了解です。
  kind: block
  block: mt_insulation
- id: 48
  speaker: 山田 隆
  text: 銘板の製造番号が、試験成績書の番号と一桁違っています。
  kind: block
  block: mt_nameplate
- id: 49
  speaker: 鈴木 舞
  text: 確認しました。銘板の方が間違っています。10月13日までに再発行して交換します。
  kind: block
  block: mt_nameplate
- id: 50
  speaker: 山田 隆
  text: お願いします。
  kind: block
  block: mt_nameplate
- id: 51
  speaker: 鈴木 舞
  text: お車は来客用の駐車場に止められましたか。
  kind: chitchat
  block: cc_parking
- id: 52
  speaker: 山田 隆
  text: はい、守衛所で案内してもらいました。
  kind: chitchat
  block: cc_parking
- id: 53
  speaker: 佐藤 健二
  text: 予備品として、軸受を1セット追加で購入したいと考えています。
  kind: block
  block: mt_spare
- id: 54
  speaker: 鈴木 舞
  text: 承知しました。10月16日までにお見積もりをお出しします。
  kind: block
  block: mt_spare
- id: 55
  speaker: 佐藤 健二
  text: 見積もりを見てから発注するか決めます。継続協議でお願いします。
  kind: block
  block: mt_spare
- id: 56
  speaker: 鈴木 舞
  text: 本日予定していた項目は以上です。残った課題は議事録にまとめて送付いたします。
  kind: closing
  block: null
- id: 57
  speaker: 佐藤 健二
  text: ありがとうございました。お疲れさまでした。
  kind: closing
  block: null
